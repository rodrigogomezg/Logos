<script>
(function () {
  var API   = (window.API_BASE || '/Logos/api') + '/vendedores';
  var datos = [];
  var editId = null;

  var overlay = document.getElementById('modal-overlay');
  var body    = document.getElementById('tabla-body');
  var empty   = document.getElementById('empty-msg');
  var lbl     = document.getElementById('lbl-count');
  var fActivo = document.getElementById('f-activo');
  var lblActivo = document.getElementById('lbl-activo');

  fActivo.addEventListener('change', function () {
    lblActivo.textContent = fActivo.checked ? 'Activo' : 'Inactivo';
  });

  function fmt(n) {
    if (n == null) return '—';
    return '$ ' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  function fmtFecha(d) {
    if (!d) return '';
    var p = d.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function cargar() {
    var todos = document.getElementById('chk-todos').checked;
    fetch(API + (todos ? '?todos=1' : ''), { headers: {} })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        datos = d;
        renderizar();
      });
  }

  function renderizar() {
    var q = document.getElementById('inp-search').value.toLowerCase();
    var filas = datos.filter(function (v) { return v.nombre.toLowerCase().includes(q); });
    lbl.textContent = filas.length + ' vendedor' + (filas.length !== 1 ? 'es' : '');
    body.innerHTML = '';
    if (!filas.length) { empty.style.display = ''; return; }
    empty.style.display = 'none';
    filas.forEach(function (v) {
      var tr = document.createElement('tr');
      var periodo = (v.meta_desde || v.meta_hasta)
        ? (fmtFecha(v.meta_desde) || '?') + ' — ' + (fmtFecha(v.meta_hasta) || '?')
        : '—';
      tr.innerHTML =
        '<td><strong>' + esc(v.nombre) + '</strong></td>' +
        '<td>' + fmt(v.meta_monto) + '</td>' +
        '<td style="font-size:11px;color:var(--neo-text-2)">' + esc(periodo) + '</td>' +
        '<td><span class="' + (v.activo ? 'badge-on' : 'badge-off') + '">' + (v.activo ? 'Activo' : 'Inactivo') + '</span></td>' +
        '<td>' +
          '<button class="btn-icon" title="Editar" data-id="' + v.id + '" data-accion="editar">✏️</button> ' +
          (v.activo
            ? '<button class="btn-icon danger" title="Desactivar" data-id="' + v.id + '" data-accion="desactivar">🔕</button>'
            : '') +
        '</td>';
      body.appendChild(tr);
    });
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  body.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-accion]');
    if (!btn) return;
    var id     = parseInt(btn.dataset.id);
    var accion = btn.dataset.accion;
    var v      = datos.find(function (x) { return x.id === id; });
    if (accion === 'editar' && v) abrirModal(v);
    if (accion === 'desactivar' && v) desactivar(v);
  });

  function abrirModal(v) {
    editId = v ? v.id : null;
    document.getElementById('modal-titulo').textContent = v ? 'Editar vendedor' : 'Nuevo vendedor';
    document.getElementById('f-nombre').value      = v ? v.nombre        : '';
    document.getElementById('f-activo').checked    = v ? v.activo        : true;
    document.getElementById('f-meta-monto').value  = v && v.meta_monto != null ? v.meta_monto : '';
    document.getElementById('f-meta-desde').value  = v ? (v.meta_desde || '') : '';
    document.getElementById('f-meta-hasta').value  = v ? (v.meta_hasta || '') : '';
    lblActivo.textContent = (v ? v.activo : true) ? 'Activo' : 'Inactivo';
    overlay.classList.add('abierto');
    document.getElementById('f-nombre').focus();
  }

  function cerrarModal() {
    overlay.classList.remove('abierto');
    editId = null;
  }

  document.getElementById('btn-nuevo').addEventListener('click',   function () { abrirModal(null); });
  document.getElementById('btn-cancelar').addEventListener('click', cerrarModal);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) cerrarModal(); });

  document.getElementById('btn-guardar').addEventListener('click', function () {
    var nombre = document.getElementById('f-nombre').value.trim();
    if (!nombre) { alert('El nombre es requerido.'); return; }
    var payload = {
      nombre:     nombre,
      activo:     document.getElementById('f-activo').checked,
      meta_monto: document.getElementById('f-meta-monto').value !== '' ? parseFloat(document.getElementById('f-meta-monto').value) : null,
      meta_desde: document.getElementById('f-meta-desde').value || null,
      meta_hasta: document.getElementById('f-meta-hasta').value || null,
    };
    var url    = editId ? API + '/' + editId : API;
    var method = editId ? 'PUT' : 'POST';
    fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { alert(res.d.error || 'Error al guardar'); return; }
        cerrarModal();
        cargar();
      });
  });

  function desactivar(v) {
    if (!confirm('¿Desactivar a ' + v.nombre + '?\nNo se eliminarán sus ventas históricas.')) return;
    fetch(API + '/' + v.id, { method: 'DELETE', headers: {} })
      .then(function (r) { return r.json(); })
      .then(function () { cargar(); });
  }

  document.getElementById('inp-search').addEventListener('input', renderizar);
  document.getElementById('chk-todos').addEventListener('change', cargar);

  cargar();
})();
</script>
</body>
