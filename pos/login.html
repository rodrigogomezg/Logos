<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/Logos/logos_logo.png">
<title>Logos — Ingresar</title>
<script src="config.js"></script>
<script src="helpers.js"></script>
<link rel="stylesheet" href="pos-base.css">
<style>
  body { align-items:center; justify-content:center; }

  .login-wrap {
    background: #fff;
    border: 1px solid var(--borde-fuerte);
    border-radius: var(--neo-r-lg);
    padding: 40px 36px 36px;
    width: 380px;
  }

  .login-box { display:flex; flex-direction:column; align-items:center; gap:28px; }
  .login-box img { height:48px; }

  .paso { width:100%; display:none; flex-direction:column; align-items:center; gap:18px; }
  .paso.activo { display:flex; }

  .titulo {
    color: var(--neo-text);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.2px;
    text-align: center;
  }

  /* Botones de usuario */
  .login-input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--borde-fuerte);
    border-radius: var(--neo-r-md);
    font-size: 14px;
    font-family: inherit;
    color: var(--neo-text);
    background: #fff;
    box-sizing: border-box;
    outline: none;
    transition: border-color var(--neo-t-fast);
  }
  .login-input:focus { border-color: var(--color-primary); }
  .login-btn {
    width: 100%;
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: var(--neo-r-md);
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity var(--neo-t-fast);
  }
  .login-btn:hover { opacity: .88; }
  .login-btn.sec {
    background: #fff;
    color: var(--neo-text);
    border: 1px solid var(--borde-fuerte);
  }
  .login-btn.sec:hover { border-color: var(--color-primary); color: var(--color-primary); opacity: 1; }

  /* PIN dots */
  .pin-dots { display:flex; gap:12px; height:20px; align-items:center; }
  .pin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--color-bg-alt);
    border: 1px solid var(--borde-fuerte);
    transition: background var(--neo-t-fast), border-color var(--neo-t-fast), transform var(--neo-t-fast);
  }
  .pin-dot.lleno {
    background: var(--color-primary);
    border-color: var(--color-primary);
    transform: scale(1.1);
  }

  /* PIN pad */
  .pin-pad { display:grid; grid-template-columns:repeat(3, 72px); gap:12px; }
  .pin-tecla {
    background: #fff;
    color: var(--neo-text);
    border: 1px solid var(--borde-fuerte);
    border-radius: var(--neo-r-md);
    height: 64px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: border-color var(--neo-t-fast), background var(--neo-t-fast), color var(--neo-t-fast);
  }
  .pin-tecla:hover  { border-color: var(--color-primary); color: var(--color-primary); }
  .pin-tecla:active { background: var(--primary-soft); }
  .pin-tecla.secundaria { font-size: 13px; font-weight: 600; color: var(--neo-text-2); }

  /* Volver */
  .volver {
    color: var(--neo-text-3);
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    font-weight: 500;
    transition: color var(--neo-t-fast);
  }
  .volver:hover { color: var(--neo-text-2); }

  /* Error */
  .error-msg {
    color: var(--neo-danger);
    font-size: 12px;
    font-weight: 600;
    min-height: 16px;
    text-align: center;
  }

  /* Selector de caja */
  .caja-grid { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%; }
  .caja-btn {
    background: #fff;
    color: var(--neo-text);
    border: 1px solid var(--borde-fuerte);
    border-radius: var(--neo-r-md);
    padding: 18px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    min-width: 140px;
    transition: border-color var(--neo-t-fast), color var(--neo-t-fast), background var(--neo-t-fast);
  }
  .caja-btn:hover  { border-color: var(--color-primary); color: var(--color-primary); }
  .caja-btn:active { background: var(--primary-soft); }

  /* Sin conexión */
  .sin-conexion-text {
    font-size: 13px;
    color: var(--neo-text-2);
    line-height: 1.6;
    text-align: center;
  }
</style>
</head>
<body>

<div class="login-wrap">
<div class="login-box">
  <img src="/Logos/logos_logo.png" alt="Logos" id="login-logo">

  <div class="paso activo" id="paso-nombre">
    <div class="titulo">Iniciar sesión</div>
    <input type="text" id="nombre-input" class="login-input" placeholder="Nombre de usuario" autocomplete="off" spellcheck="false">
    <div class="error-msg" id="nombre-error"></div>
    <button class="login-btn" id="nombre-submit">Continuar</button>
  </div>

  <div class="paso" id="paso-pin">
    <div class="titulo" id="pin-titulo">PIN</div>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="error-msg" id="pin-error"></div>
    <div class="pin-pad" id="pin-pad"></div>
    <a class="volver" id="pin-volver">‹ Volver</a>
  </div>

  <div class="paso" id="paso-caja">
    <div class="titulo">¿Con qué caja vas a trabajar?</div>
    <div class="caja-grid" id="caja-grid"></div>
  </div>

  <div class="paso" id="paso-sin-conexion">
    <div class="titulo">Sin conexión a la base de datos</div>
    <p class="sin-conexion-text">
      El servidor de base de datos no responde.<br>
      Cerrá y volvé a abrir la aplicación. Si el problema persiste, reiniciá la PC.
    </p>
    <button class="login-btn sec" onclick="location.reload()">Reintentar</button>
  </div>
</div>
</div>

<script>
// Identidad de marca fija (navy/dorado): el tema por color quedó
// desactivado; limpiar el cache de versiones anteriores.
try { localStorage.removeItem('logos_tema'); } catch(e) {}

const API = '/Logos/api';
let usuarioActual  = null;
let pin            = '';
let tokenSesion    = null;
let sucursalesData = [];
let _usuarios      = [];

function mostrarPaso(id) {
  document.querySelectorAll('.paso').forEach(p => p.classList.remove('activo'));
  document.getElementById(id).classList.add('activo');
}

async function cargarUsuarios() {
  try {
    const res = await fetch(`${API}/usuarios`);
    _usuarios = await res.json();
  } catch (e) {
    _usuarios = [];
  }
  document.getElementById('nombre-input').focus();
}

function buscarYSeleccionar() {
  const val = document.getElementById('nombre-input').value.trim();
  const errEl = document.getElementById('nombre-error');
  if (!val) { errEl.textContent = 'Ingresá tu nombre de usuario'; return; }
  const u = _usuarios.find(x => x.nombre.trim().toLowerCase() === val.toLowerCase());
  if (!u) { errEl.textContent = 'Usuario no encontrado'; return; }
  errEl.textContent = '';
  seleccionarUsuario(u);
}

document.getElementById('nombre-submit').onclick = buscarYSeleccionar;
document.getElementById('nombre-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscarYSeleccionar();
});

function seleccionarUsuario(u) {
  usuarioActual = u;
  pin = '';
  document.getElementById('pin-titulo').textContent = u.nombre;
  document.getElementById('pin-error').textContent = '';
  renderDots();
  mostrarPaso('paso-pin');
}

function renderDots() {
  const cont = document.getElementById('pin-dots');
  cont.innerHTML = '';
  const cantidad = Math.max(pin.length, 4);
  for (let i = 0; i < cantidad; i++) {
    const d = document.createElement('div');
    d.className = 'pin-dot' + (i < pin.length ? ' lleno' : '');
    cont.appendChild(d);
  }
}

function renderPad() {
  const pad = document.getElementById('pin-pad');
  pad.innerHTML = '';
  const teclas = ['1','2','3','4','5','6','7','8','9','borrar','0','ingresar'];
  teclas.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'pin-tecla' + (t === 'borrar' || t === 'ingresar' ? ' secundaria' : '');
    btn.textContent = t === 'borrar' ? '⌫' : (t === 'ingresar' ? 'OK' : t);
    btn.onclick = () => onTecla(t);
    pad.appendChild(btn);
  });
}

function onTecla(t) {
  if (t === 'borrar') {
    pin = pin.slice(0, -1);
  } else if (t === 'ingresar') {
    intentarLogin();
    return;
  } else if (pin.length < 6) {
    pin += t;
  }
  renderDots();
}

async function intentarLogin() {
  if (pin.length < 4) {
    document.getElementById('pin-error').textContent = 'PIN incompleto';
    return;
  }
  const _devName = (() => { try { return localStorage.getItem('logos_device_name'); } catch(e) { return null; } })();
  const res = await fetch(`${API}/usuarios/login`, {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, _devName ? { 'X-Device-Name': _devName } : {}),
    body: JSON.stringify({ usuario_id: usuarioActual.id, pin })
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('pin-error').textContent = data.error || 'PIN incorrecto';
    pin = '';
    renderDots();
    return;
  }

  tokenSesion    = data.token;
  sucursalesData = data.sucursales || [];

  if (data.usuario.rol === 'admin' && data.caja_default) {
    iniciarSesion(data.usuario, data.caja_default);
    return;
  }
  if (data.cajas.length === 1) {
    iniciarSesion(data.usuario, data.cajas[0]);
    return;
  }
  mostrarSelectorCaja(data.usuario, data.cajas);
}

function mostrarSelectorCaja(usuario, cajas) {
  const grid = document.getElementById('caja-grid');
  grid.innerHTML = '';
  if (!cajas.length) {
    // Sin cajas habilitadas para este usuario (los no-admin solo ven cajas
    // de tipo Venta): explicar el porqué en vez de mostrar una pantalla vacía.
    const aviso = document.createElement('div');
    aviso.style.cssText = 'font-size:13px;color:var(--neo-text-2);line-height:1.6;max-width:320px;text-align:center';
    aviso.innerHTML = 'No hay cajas disponibles para tu usuario.<br>' +
      'Pedile a un administrador que cree una <b>caja de tipo Venta</b> en Configuración, ' +
      'o que te dé el permiso <b>"Operar todas las cajas"</b>.';
    grid.appendChild(aviso);
    mostrarPaso('paso-caja');
    return;
  }
  cajas.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'caja-btn';
    btn.textContent = c.nombre;
    btn.onclick = () => iniciarSesion(usuario, c);
    grid.appendChild(btn);
  });
  mostrarPaso('paso-caja');
}

function iniciarSesion(usuario, caja) {
  const sucursal = sucursalesData.find(s => s.id === (caja.sucursal_id || 1)) || sucursalesData[0] || null;
  localStorage.setItem('logos_sesion', JSON.stringify({
    usuario_id:   usuario.id,
    nombre:       usuario.nombre,
    rol:          usuario.rol,
    permisos:     usuario.permisos || {},
    caja_id:      caja.id,
    caja_nombre:  caja.nombre,
    sucursales:   sucursalesData,
    sucursal_id:  sucursal?.id ?? 1,
    deposito_id:  sucursal?.deposito_principal_id ?? 1,
    token:        tokenSesion,
  }));
  location.href = '/Logos/pos/';
}

document.getElementById('pin-volver').onclick = () => {
  usuarioActual = null;
  pin = '';
  document.getElementById('nombre-input').value = '';
  document.getElementById('nombre-error').textContent = '';
  mostrarPaso('paso-nombre');
  document.getElementById('nombre-input').focus();
};

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('paso-pin').classList.contains('activo')) return;
  if (e.key >= '0' && e.key <= '9') {
    onTecla(e.key);
  } else if (e.key === 'Backspace') {
    onTecla('borrar');
  } else if (e.key === 'Enter') {
    onTecla('ingresar');
  } else if (e.key === 'Escape') {
    document.getElementById('pin-volver').click();
  }
});

async function chequearInstalacion() {
  try {
    const estado = await fetch(`${API}/instalacion/estado`).then(r => r.json());
    if (estado.sin_conexion) {
      mostrarPaso('paso-sin-conexion');
      return true;
    }
    if (estado.requiere_conexion || estado.requiere_schema || estado.requiere_admin ||
        estado.requiere_negocio || estado.requiere_caja) {
      location.href = '/Logos/pos/instalar.html';
      return true;
    }
  } catch (e) {
    // Si falla el chequeo (ej. red), seguimos al login normal en vez de bloquear.
  }
  return false;
}

renderPad();
chequearInstalacion().then(redirigido => { if (!redirigido) { cargarUsuarios(); } });
</script>
</body>
</html>
