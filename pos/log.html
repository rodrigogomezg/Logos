<script>
const API = window.APP_CONFIG?.API_BASE ?? '/Logos/api';
const $   = id => document.getElementById(id);

let toastTimer = null;
function toast(msg, tipo = '') {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast' + (tipo ? ' ' + tipo : '');
  void el.offsetWidth;
  el.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('visible'), tipo === 'err' ? 5500 : 3500);
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
}

const ACCION_LABELS = {
  anular_venta:    'Anular venta',
  editar_venta:    'Editar venta',
  descuento_manual:'Descuento manual',
  anular_compra:   'Anular compra',
  editar_compra:   'Editar compra',
  cierre_caja:     'Cierre Z',
  cierre_parcial:  'Cierre parcial',
  ajuste_stock:    'Ajuste stock',
  login:           'Login',
  crear_usuario:   'Crear usuario',
  editar_usuario:  'Editar usuario',
  eliminar_usuario:'Eliminar usuario',
};

const TIPO_PAGO = { efectivo:'Efectivo', tarjeta:'Tarjeta', transferencia:'Transf.', cuenta_corriente:'Cta. cte.', mixto:'Mixto' };
const TIPO_MOV  = { entrada:'Entrada', salida:'Salida', ajuste:'Ajuste', inicial:'Inicial' };
const KNOWN_KEYS = new Set(['total','tipo_pago','tiene_cae','diferencia','efectivo_contado',
  'items_con_descuento','nombre','rol','activo','pin_cambiado','campos',
  'tipo','delta','stock_anterior','stock_actual','proveedor_id']);

function renderDetalle(str) {
  if (!str) return '<span style="color:var(--neo-text-3)">—</span>';
  let obj;
  try { obj = JSON.parse(str); } catch(e) { return esc(str); }
  if (typeof obj !== 'object' || obj === null) return esc(String(obj));

  const chips = [];
  const mon = v => '$ ' + Number(v).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const cv  = (val, cls = '') => `<span class="v${cls ? ' '+cls : ''}">${esc(String(val))}</span>`;
  const c   = (label, valHtml) => chips.push(`<span class="dc"><span class="k">${label}</span>${valHtml}</span>`);

  if ('total'               in obj)                      c('Total',      cv(mon(obj.total)));
  if ('tipo_pago'           in obj && obj.tipo_pago != null) c('Tipo',   cv(TIPO_PAGO[obj.tipo_pago] ?? obj.tipo_pago));
  if ('tiene_cae'           in obj)                      c('CAE',        cv(obj.tiene_cae ? 'sí' : 'no', obj.tiene_cae ? 'p' : 'n'));
  if ('diferencia'          in obj) {
    const d = Number(obj.diferencia);
    c('Diferencia', cv((d > 0 ? '+' : '') + mon(d), d < 0 ? 'n' : d > 0 ? 'p' : ''));
  }
  if ('efectivo_contado'    in obj)                      c('Efectivo',   cv(mon(obj.efectivo_contado)));
  if ('items_con_descuento' in obj)                      c('Con desc.',  cv(obj.items_con_descuento + ' ítem' + (obj.items_con_descuento !== 1 ? 's' : '')));
  if ('nombre'              in obj)                      c('Usuario',    cv(obj.nombre));
  if ('rol'                 in obj)                      c('Rol',        cv(obj.rol));
  if ('activo'              in obj && obj.activo != null) c('Activo',    cv(obj.activo ? 'sí' : 'no', obj.activo ? 'p' : 'n'));
  if ('pin_cambiado'        in obj)                      c('PIN',        cv(obj.pin_cambiado ? 'cambiado' : 'sin cambios', obj.pin_cambiado ? '' : 'd'));
  if ('campos'              in obj) {
    const val = Array.isArray(obj.campos) ? obj.campos.join(', ') : String(obj.campos ?? '');
    c('Campos', cv(val));
  }
  if ('tipo'          in obj)                            c('Movim.',     cv(TIPO_MOV[obj.tipo] ?? obj.tipo));
  if ('delta'         in obj) {
    const d = Number(obj.delta);
    c('Δ stock', cv((d > 0 ? '+' : '') + d, d < 0 ? 'n' : 'p'));
  }
  if ('stock_anterior' in obj)                           c('Antes',      cv(obj.stock_anterior));
  if ('stock_actual'   in obj)                           c('Ahora',      cv(obj.stock_actual));
  if ('proveedor_id'   in obj && obj.proveedor_id != null) c('Prov.',    cv('#' + obj.proveedor_id));

  for (const [k, val] of Object.entries(obj)) {
    if (KNOWN_KEYS.has(k)) continue;
    c(esc(k), cv(typeof val === 'object' ? JSON.stringify(val) : String(val ?? '')));
  }

  return chips.length ? chips.join('') : '—';
}

async function cargar() {
  const params = new URLSearchParams({ limit: 200 });
  if ($('f-desde').value)  params.set('desde',  $('f-desde').value);
  if ($('f-hasta').value)  params.set('hasta',  $('f-hasta').value);
  if ($('f-accion').value) params.set('accion', $('f-accion').value);
  if ($('f-equipo').value.trim()) params.set('equipo', $('f-equipo').value.trim());

  try {
    const r = await fetch(`${API}/log-acciones?${params}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error ?? 'Error');

    if (!d.length) {
      $('tbody').innerHTML = '<tr><td colspan="7" class="vacio">Sin registros para los filtros seleccionados.</td></tr>';
      return;
    }

    $('tbody').innerHTML = d.map(log => {
      const accion     = log.accion ?? '';
      const label      = ACCION_LABELS[accion] ?? accion;
      const entidadStr = log.entidad ? `${esc(log.entidad)} #${log.entidad_id ?? '?'}` : '—';
      return `<tr>
        <td class="td-fecha">${esc(log.fecha)}</td>
        <td>${esc(log.usuario_nom ?? '—')}</td>
        <td><span class="accion-badge ${esc(accion)}">${esc(label)}</span></td>
        <td>${entidadStr}</td>
        <td class="td-detalle">${renderDetalle(log.detalle)}</td>
        <td style="font-size:11px;color:var(--neo-text-3)">${esc(log.ip ?? '—')}</td>
        <td style="font-size:11px;color:var(--neo-text-3)">${esc(log.device_name ?? '—')}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    $('tbody').innerHTML = `<tr><td colspan="7" class="vacio">${esc(e.message)}</td></tr>`;
    toast(e.message, 'err');
  }
}

(function init() {
  // Requiere el permiso de bitácora (auth.js también lo valida)
  if (!(window.puede?.('log') ?? (window.LOGOS_SESION?.rol === 'admin'))) {
    location.href = window.APP_CONFIG?.POS_BASE + '/';
    return;
  }

  // Fechas default: este mes
  const hoy = new Date();
  const pad = n => String(n).padStart(2, '0');
  $('f-desde').value = `${hoy.getFullYear()}-${pad(hoy.getMonth()+1)}-01`;
  $('f-hasta').value = `${hoy.getFullYear()}-${pad(hoy.getMonth()+1)}-${pad(hoy.getDate())}`;

  $('btn-buscar').addEventListener('click', cargar);
  cargar();
})();

// ── Tour guiado ───────────────────────────────────────────────────
window.TOUR_PAGE_KEY = 'log';
window.TOUR_STEPS = [

  },
  {
    el: '#f-accion',
    title: 'Tipo de acción',
    body: 'Las acciones están agrupadas por categoría: Ventas, Compras, Caja y Usuarios. Seleccioná una para ver solo ese tipo de eventos y reducir el ruido.',
  },
  {
    el: '#tbody',
    title: 'Registro de operaciones',
    body: 'Cada fila muestra: fecha/hora exacta, qué usuario hizo qué, desde qué equipo y con qué detalle. Útil para auditorías, reclamos de clientes o detectar usos incorrectos del sistema.',
  },
