<script>
const API = window.CONFIG?.apiBase ?? '/Logos/api';
let vistaActual = 'resumen';
let charts = {};

// Defaults: mes actual
const hoy = new Date();
document.getElementById('tb-desde').value = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-01`;
document.getElementById('tb-hasta').value = hoy.toISOString().slice(0,10);

function setVista(v, btn) {
  vistaActual = v;
  document.querySelectorAll('.tab-vista').forEach(b => b.classList.toggle('activo', b === btn));
  const esTend   = v === 'tendencia';
  const esMargen = v === 'margen'; // catálogo actual: no depende del período
  ['sep-meses','lbl-meses','sel-meses'].forEach(id => document.getElementById(id).style.display = esTend ? '' : 'none');
  document.getElementById('wrap-fechas').style.display = (esTend || esMargen) ? 'none' : 'flex';
  document.getElementById('kpis-row').style.display = (esTend || esMargen) ? 'none' : '';
  cargarVista();
}

function pesos(n, corto) {
  if (corto && Math.abs(n) >= 1000000) return '$ ' + (n/1000000).toFixed(1) + 'M';
  if (corto && Math.abs(n) >= 1000)    return '$ ' + (n/1000).toFixed(1) + 'k';
  return '$ ' + Number(n).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function margenBar(pct) {
  const w = Math.min(100, Math.max(0, pct));
  return `<div class="margen-bar"><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div><span class="bar-pct">${pct.toFixed(1)}%</span></div>`;
}

function destroyCharts() { Object.values(charts).forEach(c => c.destroy()); charts = {}; }

function colorSet(n) {
  const palette = ['#163B66','#27AE60','#E74C3C','#F39C12','#9B59B6','#1ABC9C','#E67E22','#2980B9','#C0392B','#16A085'];
  return Array.from({length: n}, (_, i) => palette[i % palette.length]);
}

function setKpis(d) {
  document.getElementById('k-ventas').textContent  = pesos(d.ventas, true);
  document.getElementById('k-costo').textContent   = pesos(d.costo,  true);
  document.getElementById('k-ganancia').textContent = pesos(d.ganancia, true);
  document.getElementById('k-margen').textContent  = d.margen_pct + '%';
}

async function cargarVista() {
  destroyCharts();
  const cnt = document.getElementById('contenido');
  cnt.innerHTML = '<div class="empty">Cargando…</div>';
  try {
    if (vistaActual === 'resumen')   await cargarResumen(cnt);
    if (vistaActual === 'tendencia') await cargarTendencia(cnt);
    if (vistaActual === 'abc')       await cargarAbc(cnt);
    if (vistaActual === 'clientes')  await cargarClientes(cnt);
    if (vistaActual === 'margen')    await cargarMargen(cnt);
  } catch (e) {
    cnt.innerHTML = `<div class="empty">Error al cargar datos: ${e.message}</div>`;
  }
}

async function cargarResumen(cnt) {
  const desde = document.getElementById('tb-desde').value;
  const hasta = document.getElementById('tb-hasta').value;
  if (!desde || !hasta) { cnt.innerHTML = ''; return; }

  const data = await apiFetch(`${API}/rentabilidad/resumen?desde=${desde}&hasta=${hasta}`);
  setKpis(data);

  const cats = data.por_categoria || [];
  const provs = data.por_proveedor || [];

  cnt.innerHTML = `
    <div class="grid2">
      <div class="bloque">
        <div class="bh"><span class="bt">Por Categoría</span><span class="bs">${cats.length} categorías</span></div>
        <div class="chart-pad"><canvas id="chart-cat"></canvas></div>
      </div>
      <div class="bloque">
        <div class="bh"><span class="bt">Por Proveedor</span><span class="bs">${provs.length} proveedores</span></div>
        <div class="chart-pad"><canvas id="chart-prov"></canvas></div>
      </div>
    </div>
    <div class="grid2">
      <div class="bloque">
        <div class="bh"><span class="bt">Detalle por Categoría</span></div>
        <div class="tabla-wrap">${tablaGrupo(cats)}</div>
      </div>
      <div class="bloque">
        <div class="bh"><span class="bt">Detalle por Proveedor</span></div>
        <div class="tabla-wrap">${tablaGrupo(provs)}</div>
      </div>
    </div>`;

  const chartOpts = {
    type: 'bar',
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { font: { size: 10 }, color: '#9B9590', maxRotation: 30 }, grid: { display: false } },
        y: { ticks: { font: { size: 10 }, color: '#9B9590', callback: v => pesos(v, true) }, grid: { color: '#E4DFD3' } },
      }
    }
  };

  charts['cat'] = new Chart(document.getElementById('chart-cat'), {
    ...chartOpts,
    data: {
      labels: cats.slice(0,10).map(c => c.grupo),
      datasets: [
        { label: 'Ganancia', data: cats.slice(0,10).map(c => c.ganancia), backgroundColor: colorSet(cats.length), borderRadius: 4 }
      ]
    }
  });

  charts['prov'] = new Chart(document.getElementById('chart-prov'), {
    ...chartOpts,
    data: {
      labels: provs.slice(0,10).map(p => p.grupo),
      datasets: [
        { label: 'Ganancia', data: provs.slice(0,10).map(p => p.ganancia), backgroundColor: colorSet(provs.length), borderRadius: 4 }
      ]
    }
  });
}

function tablaGrupo(rows) {
  if (!rows.length) return '<div class="empty">Sin datos</div>';
  const filas = rows.map(r => `
    <tr>
      <td>${esc(r.grupo)}</td>
      <td class="r">${pesos(r.ventas, true)}</td>
      <td class="r">${pesos(r.ganancia, true)}</td>
      <td>${margenBar(r.margen_pct)}</td>
    </tr>`).join('');
  return `<table><thead><tr><th>Grupo</th><th class="r">Ventas</th><th class="r">Ganancia</th><th>Margen</th></tr></thead><tbody>${filas}</tbody></table>`;
}

async function cargarTendencia(cnt) {
  const meses = document.getElementById('sel-meses').value;
  const data = await apiFetch(`${API}/rentabilidad/tendencia?meses=${meses}`);
  const rows = data.datos || [];

  if (!rows.length) { cnt.innerHTML = '<div class="empty">Sin datos de ventas en el período.</div>'; return; }

  cnt.innerHTML = `
    <div class="bloque">
      <div class="bh"><span class="bt">Ventas vs Costo — últimos ${meses} meses</span></div>
      <div class="chart-pad" style="height:280px"><canvas id="chart-tend"></canvas></div>
    </div>
    <div class="bloque">
      <div class="bh"><span class="bt">Margen mensual</span></div>
      <div class="chart-pad"><canvas id="chart-margen"></canvas></div>
    </div>`;

  const labels = rows.map(r => r.mes);
  const colores = { ventas: '#163B66', costo: '#E74C3C', ganancia: '#27AE60' };

  charts['tend'] = new Chart(document.getElementById('chart-tend'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Ventas',  data: rows.map(r => r.ventas),  backgroundColor: colores.ventas  + '99', borderRadius: 3 },
        { label: 'Costo',   data: rows.map(r => r.costo),   backgroundColor: colores.costo   + '99', borderRadius: 3 },
        { label: 'Ganancia',data: rows.map(r => r.ganancia),backgroundColor: colores.ganancia + '99', borderRadius: 3 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { size: 10 }, color: '#9B9590' } } },
      scales: {
        x: { ticks: { font:{size:10}, color:'#9B9590' }, grid:{display:false} },
        y: { ticks: { font:{size:10}, color:'#9B9590', callback: v => pesos(v,true) }, grid:{color:'#E4DFD3'} }
      }
    }
  });

  charts['margen'] = new Chart(document.getElementById('chart-margen'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Margen %', data: rows.map(r => r.margen_pct),
        borderColor: colores.ganancia, backgroundColor: colores.ganancia + '22',
        fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: colores.ganancia,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { font:{size:10}, color:'#9B9590' }, grid:{display:false} },
        y: { ticks: { font:{size:10}, color:'#9B9590', callback: v => v + '%' }, grid:{color:'#E4DFD3'} }
      }
    }
  });
}

async function cargarAbc(cnt) {
  const desde = document.getElementById('tb-desde').value;
  const hasta = document.getElementById('tb-hasta').value;
  if (!desde || !hasta) { cnt.innerHTML = ''; return; }

  const data = await apiFetch(`${API}/rentabilidad/abc?desde=${desde}&hasta=${hasta}`);
  const prods = data.productos || [];

  setKpis({ ventas: prods.reduce((s,p) => s+p.ventas,0), costo: prods.reduce((s,p) => s+p.costo,0),
            ganancia: data.total_ganancia, margen_pct: prods.length && prods[0].ventas > 0
              ? Math.round(data.total_ganancia / prods.reduce((s,p)=>s+p.ventas,0) * 1000) / 10 : 0 });

  const countA = prods.filter(p => p.clase_abc === 'A').length;
  const countB = prods.filter(p => p.clase_abc === 'B').length;
  const countC = prods.filter(p => p.clase_abc === 'C').length;

  const filas = prods.map((p, i) => `
    <tr>
      <td class="muted">${i+1}</td>
      <td><span class="abc abc-${p.clase_abc}">${p.clase_abc}</span></td>
      <td>${esc(p.codigo)}</td>
      <td>${esc(p.nombre)}</td>
      <td class="muted">${esc(p.categoria)}</td>
      <td class="muted">${esc(p.proveedor)}</td>
      <td class="r">${p.cantidad % 1 === 0 ? p.cantidad : p.cantidad.toFixed(2)}</td>
      <td class="r">${pesos(p.ventas, true)}</td>
      <td class="r">${pesos(p.ganancia, true)}</td>
      <td>${margenBar(p.margen_pct)}</td>
      <td class="r muted">${p.pct_ganancia_acum}%</td>
    </tr>`).join('');

  cnt.innerHTML = `
    <div class="bloque">
      <div class="bh">
        <span class="bt">Clasificación ABC</span>
        <span class="bs">A: ${countA} productos · B: ${countB} · C: ${countC}</span>
      </div>
      <div class="tabla-wrap" style="max-height:none">
        <table>
          <thead><tr>
            <th>#</th><th>Clase</th><th>Código</th><th>Nombre</th>
            <th>Categoría</th><th>Proveedor</th>
            <th class="r">Cant.</th><th class="r">Ventas</th>
            <th class="r">Ganancia</th><th>Margen</th><th class="r">% Acum.</th>
          </tr></thead>
          <tbody>${filas || '<tr><td colspan="11" class="empty">Sin datos para el período.</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

// ── Vista: margen crítico (catálogo actual) ─────────────────
let umbralMargen = 20;

async function cargarMargen(cnt) {
  const data = await apiFetch(`${API}/rentabilidad/margen-critico?umbral=${umbralMargen}`);
  const prods = data.productos || [];
  const negativos = prods.filter(p => p.margen_pct < 0).length;

  const filas = prods.map(p => `
    <tr>
      <td>${esc(p.codigo)}</td>
      <td>${esc(p.nombre)}</td>
      <td class="muted">${esc(p.categoria)}</td>
      <td class="muted">${esc(p.proveedor)}</td>
      <td class="r">${pesos(p.costo_actual, true)}</td>
      <td class="r">${pesos(p.precio_venta, true)}</td>
      <td class="r" style="font-weight:700;color:${p.margen_pct < 0 ? 'var(--neo-danger)' : '#B7791F'}">${p.margen_pct.toFixed(1)}%</td>
      <td class="r muted">${p.stock_actual % 1 === 0 ? p.stock_actual : p.stock_actual.toFixed(2)}</td>
    </tr>`).join('');

  cnt.innerHTML = `
    <div class="bloque">
      <div class="bh">
        <span class="bt">Margen crítico — precio vs costo actuales</span>
        <span class="bs" style="display:flex;align-items:center;gap:8px">
          ${negativos ? `<b style="color:var(--neo-danger)">${negativos} bajo costo</b> · ` : ''}
          ${prods.length} productos con margen menor a
          <input id="inp-umbral" type="number" min="0" max="90" step="1" value="${umbralMargen}"
                 style="width:56px;padding:3px 6px;font-family:inherit;font-size:12px"> %
        </span>
      </div>
      <div class="empty" style="padding:8px 14px;text-align:left;font-size:12px">
        Compara el precio de venta vigente contra el costo actual de cada producto — detecta listas
        desactualizadas. No depende del período: es una foto del catálogo de hoy.
      </div>
      <div class="tabla-wrap" style="max-height:none">
        <table>
          <thead><tr>
            <th>Código</th><th>Nombre</th><th>Categoría</th><th>Proveedor</th>
            <th class="r">Costo</th><th class="r">Precio</th><th class="r">Margen</th><th class="r">Stock</th>
          </tr></thead>
          <tbody>${filas || '<tr><td colspan="8" class="empty">Ningún producto con margen bajo el umbral.</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('inp-umbral').addEventListener('change', e => {
    umbralMargen = Math.max(0, Math.min(90, parseInt(e.target.value) || 20));
    cargarVista();
  });
}

// Init
cargarVista();

// ── Tour guiado ───────────────────────────────────────────────────
window.TOUR_PAGE_KEY = 'rentabilidad';
window.TOUR_STEPS = [
  {
    el: null,
    title: 'Rentabilidad del negocio',
    body: 'Esta pantalla analiza la ganancia real del negocio: cuánto costó lo que vendiste vs. cuánto cobraste. Requiere tener el costo de compra cargado en cada producto.',

  {

    title: 'Vistas de análisis',
    body: '<b>Resumen</b> da el panorama general. <b>Tendencia</b> muestra la evolución de margen mes a mes. <b>ABC Productos</b> clasifica artículos por ganancia (A = top, C = bajo). <b>Por Cliente</b> rankea clientes por rentabilidad. <b>Margen crítico</b> muestra los productos que vendés por debajo del margen mínimo configurado.',
  },
  {
    el: '#kpis-row',
    title: 'KPIs de rentabilidad',
    body: 'Los 4 números clave: total vendido, costo total, ganancia bruta y margen porcentual sobre ventas. Siempre referidos al período y vista seleccionados.',
  },
  {
    el: '#contenido',
    title: 'Análisis detallado',
    body: 'El contenido cambia según la vista activa: gráficos de tendencia, rankings de productos con clasificación ABC, tabla de clientes por ganancia o lista de productos con margen insuficiente para corrección de precios.',
  },
];
</script>
</body>
