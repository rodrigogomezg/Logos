<script>
'use strict';

/* ─── estado ─────────────────────────────────────────────── */
let tipo    = 'clientes';
let pagina  = 1;
let total   = 0;
let paginas = 1;
const POR_PAGINA = 50;
let debounceTimer;
let csvFile = null;

/* ─── DOM refs ───────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const thead = $('thead-contactos');
const tbody = $('tbody-contactos');
const pag   = $('paginacion');

/* ─── iniciar ────────────────────────────────────────────── */
document.querySelectorAll('.tab-tipo').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-tipo').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    tipo   = btn.dataset.tipo;
    pagina = 1;
    $('btn-importar').style.display = tipo === 'clientes' ? '' : 'none';
    renderCabecera();
    cargar();
  });
});

$('buscador').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { pagina = 1; cargar(); }, 280);
});

$('filtro-activo').addEventListener('change', () => { pagina = 1; cargar(); });

$('btn-nuevo').addEventListener('click', () =>
  ContactoModal.nuevo(tipo, { onGuardado: () => cargar() })
);
$('btn-importar').addEventListener('click', abrirImport);

/* ─── cabecera tabla ─────────────────────────────────────── */
function renderCabecera() {
  const comunes = '<th>Nombre</th><th>CUIT</th><th>Condición IVA</th><th>Teléfono</th><th>CC</th><th>Límite CC</th><th>Lista</th>';
  if (tipo === 'clientes') {
    thead.innerHTML = '<tr>' + comunes + '<th>Dto extra</th><th>Estado</th></tr>';
  } else {
    thead.innerHTML = '<tr>' + comunes + '<th>Plazo pago</th><th>Estado</th></tr>';
  }
}

/* ─── cargar datos ───────────────────────────────────────── */
async function cargar() {
  tbody.innerHTML = '<tr><td colspan="99" class="estado-tabla">Cargando…</td></tr>';
  pag.innerHTML = '';

  const q      = $('buscador').value.trim();
  const activo = $('filtro-activo').value;
  let url = `/Logos/api/${tipo}?page=${pagina}&per_page=${POR_PAGINA}`;
  if (q)           url += `&q=${encodeURIComponent(q)}`;
  if (activo !== '') url += `&activo=${activo}`;

  const resp = await fetch(url);
  if (!resp.ok) { tbody.innerHTML = '<tr><td colspan="99" class="estado-tabla">Error al cargar.</td></tr>'; return; }
  const data = await resp.json();

  total   = data.total;
  paginas = data.paginas;

  if (!data.datos.length) {
    tbody.innerHTML = '<tr><td colspan="99" class="estado-tabla">Sin resultados.</td></tr>';
    return;
  }

  tbody.innerHTML = data.datos.map(r => filaHTML(r)).join('');
  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () =>
      ContactoModal.abrir(parseInt(tr.dataset.id), tipo, { onGuardado: () => cargar(), onEliminado: () => cargar() })
    );
  });

  renderPaginacion();
}

function filaHTML(r) {
  const cc    = r.cc_habilitada ? '<span class="badge badge-verde">Sí</span>' : '<span class="badge badge-gris">No</span>';
  const lista = r.lista_precio_nombre ? `<span class="badge badge-azul">${esc(r.lista_precio_nombre)}</span>` : '—';
  const estado = r.activo ? '<span class="badge badge-verde">Activo</span>' : '<span class="badge badge-gris">Inactivo</span>';
  const limite = r.cc_habilitada ? `$${r.limite_credito.toLocaleString('es-AR',{maximumFractionDigits:0})}` : '—';
  const extra  = tipo === 'clientes'
    ? `<td>${r.descuento_extra ? r.descuento_extra + '%' : '—'}</td>`
    : `<td>${r.plazo_pago_dias ? r.plazo_pago_dias + ' días' : '—'}</td>`;
  return `<tr data-id="${r.id}" class="${r.activo ? '' : 'inactivo'}">
    <td>${esc(r.nombre)}</td>
    <td>${esc(r.cuit || '—')}</td>
    <td>${esc(r.condicion_iva || '—')}</td>
    <td>${esc(r.telefono || '—')}</td>
    <td>${cc}</td>
    <td>${limite}</td>
    <td>${lista}</td>
    ${extra}
    <td>${estado}</td>
  </tr>`;
}

function renderPaginacion() {
  if (paginas <= 1) { pag.innerHTML = `<span>${total} registro${total !== 1 ? 's' : ''}</span>`; return; }
  let html = `<span>${total} registros</span>`;
  html += `<button ${pagina === 1 ? 'disabled' : ''} data-p="${pagina-1}">‹</button>`;
  for (let p = 1; p <= paginas; p++) {
    if (paginas > 10 && Math.abs(p - pagina) > 2 && p !== 1 && p !== paginas) { if (p === 2 || p === paginas - 1) html += '<span>…</span>'; continue; }
    html += `<button class="${p === pagina ? 'activo' : ''}" data-p="${p}">${p}</button>`;
  }
  html += `<button ${pagina === paginas ? 'disabled' : ''} data-p="${pagina+1}">›</button>`;
  pag.innerHTML = html;
  pag.querySelectorAll('button[data-p]').forEach(btn => {
    btn.addEventListener('click', () => { pagina = parseInt(btn.dataset.p); cargar(); });
  });
}

/* ─── importar CSV (solo clientes) ──────────────────────── */
function abrirImport() {
  csvFile = null;
  $('input-csv').value = '';
  $('import-nombre').style.display = 'none';
  $('import-result').style.display = 'none';
  $('btn-subir').disabled = true;
  $('modal-import').classList.remove('oculto');
}

$('import-cerrar').addEventListener('click',   () => $('modal-import').classList.add('oculto'));
$('import-cancelar').addEventListener('click', () => $('modal-import').classList.add('oculto'));
$('link-plantilla').addEventListener('click', e => { e.preventDefault(); window.location = '/Logos/api/clientes/plantilla-csv'; });

const dropZone = $('drop-zone');
dropZone.addEventListener('click', () => $('input-csv').click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) setCSV(e.dataTransfer.files[0]);
});
$('input-csv').addEventListener('change', () => { if ($('input-csv').files[0]) setCSV($('input-csv').files[0]); });

function setCSV(file) {
  csvFile = file;
  $('import-nombre').textContent = file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
  $('import-nombre').style.display = '';
  $('import-result').style.display = 'none';
  $('btn-subir').disabled = false;
}

$('btn-subir').addEventListener('click', async () => {
  if (!csvFile) return;
  $('btn-subir').disabled = true;
  $('btn-subir').textContent = 'Importando…';

  const fd = new FormData();
  fd.append('csv', csvFile);
  const resp = await fetch('/Logos/api/clientes/importar', { method: 'POST', body: fd });
  const data = await resp.json();

  const el = $('import-result');
  if (!resp.ok) {
    el.innerHTML = `<span class="err">Error: ${esc(data.error)}</span>`;
  } else {
    let html = `<span class="ok">Creados: ${data.creados} · Actualizados: ${data.actualizados}</span>`;
    if (data.errores?.length) {
      html += `<div class="errores-lista">${data.errores.map(e => esc(e)).join('<br>')}</div>`;
    }
    el.innerHTML = html;
    if (!data.errores?.length) cargar();
  }
  el.style.display = '';
  $('btn-subir').disabled = false;
  $('btn-subir').textContent = 'Subir e importar';
});

/* ─── helpers ────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─── boot ───────────────────────────────────────────────── */
renderCabecera();
$('btn-importar').style.display = '';
cargar();
</script>
</body>
