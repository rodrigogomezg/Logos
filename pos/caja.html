<script>
const API = '/Logos/api';
const $   = id => document.getElementById(id);

let toastTimer = null;
function toast(msg, tipo = '') {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast' + (tipo ? ' ' + tipo : '');
  void el.offsetWidth;
  el.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('visible'), tipo === 'err' ? 5500 : 3500);
}
function fmt(n) {
  return '$ ' + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDt(s) {
  return new Date(s).toLocaleString('es-AR', { dateStyle:'short', timeStyle:'short' });
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
}

const cajaId = window.LOGOS_SESION?.caja_id ?? null;
let turnoActualId    = null;
let modalTipo        = null;
let periodoData      = null;
let terminalesPostnet = [];

// ── Carga inicial ──────────────────────────────────────────
async function cargar() {
  if (!cajaId) {
    $('contenido-inner').innerHTML = '<div class="card"><div class="card-body"><p class="form-hint">No hay una caja activa en la sesión.</p></div></div>';
    return;
  }
  try {
    const rc  = await fetch(`${API}/configuracion`);
    const cfg = await rc.json();
    terminalesPostnet = Array.isArray(cfg.posnet_terminales) ? cfg.posnet_terminales : [];
  } catch (_) { terminalesPostnet = []; }

  const res  = await fetch(`${API}/caja-turnos/actual?caja_id=${cajaId}`);
  const data = await res.json();

  if (data.no_aplica)  { renderNoAplica(); }
  else if (!data.turno){ renderApertura(data.fondo_sugerido || 0); }
  else { turnoActualId = data.turno.id; renderTurnoAbierto(data); }
}

function renderNoAplica() {
  $('contenido-inner').className = 'contenido-inner solo';
  $('contenido-inner').innerHTML = `
    <div class="card"><div class="card-body">
      <p class="no-aplica">Esta caja (<strong>${esc(window.LOGOS_SESION?.caja_nombre || '')}</strong>) no maneja apertura ni cierre de turno.</p>
    </div></div>`;
}

function renderApertura(fondoSugerido) {
  turnoActualId = null;
  $('contenido-inner').className = 'contenido-inner solo';
  $('contenido-inner').innerHTML = `
    <div class="card">
      <div class="card-header">
        <h2>Apertura de caja — ${esc(window.LOGOS_SESION?.caja_nombre || '')}</h2>
        <span class="estado-pill cerrado"><span class="dot"></span>Sin turno abierto</span>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label class="form-label">Fondo inicial</label>
          <input class="form-input" id="ap-fondo" type="number" min="0" step="0.01" value="${Number(fondoSugerido).toFixed(2)}" style="width:200px">
          <span class="form-hint" style="margin-top:4px">Sugerido a partir del efectivo contado en el último cierre.</span>
        </div>
        <div style="margin-top:16px">
          <button class="btn btn-ok" id="ap-btn">Abrir caja</button>
        </div>
      </div>
    </div>`;
  $('ap-btn').addEventListener('click', abrirCaja);
}

async function abrirCaja() {
  const fondo_inicial = parseFloat($('ap-fondo').value);
  if (isNaN(fondo_inicial) || fondo_inicial < 0) { toast('Fondo inicial inválido', 'err'); return; }
  $('ap-btn').disabled = true;
  const res = await fetch(`${API}/caja-turnos`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ caja_id: cajaId, fondo_inicial }),
  });
  const data = await res.json();
  if (!res.ok) { toast(data.error || 'Error al abrir la caja', 'err'); $('ap-btn').disabled = false; return; }
  toast('Caja abierta');
  cargar();
}

function cnt(n) { return n > 0 ? `<span style="font-size:10px;color:var(--gris3);font-weight:400;margin-left:4px">(${n} op.)</span>` : ''; }

// ── Visualizaciones del turno ──────────────────────────────
const MEDIOS_COBRO = [
  { k: 'efectivo',      lbl: 'Efectivo',      color: '#15803D' },
  { k: 'tarjeta',       lbl: 'Tarjeta',       color: '#2563EB' },
  { k: 'transferencia', lbl: 'Transferencia', color: '#7C3AED' },
  { k: 'mercado_pago',  lbl: 'Mercado Pago',  color: '#0891B2' },
  { k: 'cheque',        lbl: 'Cheque',        color: '#B45309' },
  { k: 'cc',            lbl: 'Cta. Cte.',     color: '#9B9590' },
];

function pct(v, total) { return (v / total * 100).toFixed(1).replace('.', ',') + ' %'; }

function fmtCompacto(n) {
  n = Number(n || 0);
  if (n >= 1000000) return (n / 1000000).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + 'M';
  if (n >= 1000)    return (n / 1000).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + 'k';
  return String(Math.round(n));
}

    ultimaSub = hace < 1 ? 'recién' : hace < 60 ? `hace ${hace} min` : `hace ${Math.floor(hace / 60)} h ${hace % 60} m`;
  }

  const nDev = Number(data.count_devoluciones || 0);
  return `
    <div class="stats-strip">
      <div class="stat">
        <div class="stat-lbl">Operaciones</div>
        <div class="stat-val">${ops}</div>
        <div class="stat-sub">${nDev > 0 ? nDev + (nDev > 1 ? ' devoluciones' : ' devolución') : 'sin devoluciones'}</div>

        <div class="stat-lbl">Ticket promedio</div>

        <div class="stat-val">${dur}</div>
        <div class="stat-sub">desde las ${desde}</div>
      </div>
    </div>`;
}

function mediosCobroHTML(data) {
  // Ventas puras (sin ingresos/retiros/transferencias de caja): cómo pagaron los clientes
  const items = MEDIOS_COBRO
    .map(m => ({ ...m, val: Number(data['ventas_' + m.k] || 0), cnt: Number(data['count_' + m.k] || 0) }))
    .filter(m => m.val > 0.009);
  const total = items.reduce((s, m) => s + m.val, 0);
  if (!items.length || total <= 0) {
    return '<div class="chart-vacio">Todavía no hay cobros registrados en este turno.</div>';
  }

  const R = 62, C = 2 * Math.PI * R;
  const gap = items.length > 1 ? 2.5 : 0;
  let off = 0;
  const segs = items.map(m => {
    const len = m.val / total * C;
    const seg = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${m.color}" stroke-width="30"
      stroke-dasharray="${Math.max(len - gap, 1).toFixed(2)} ${C.toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)">
      <title>${m.lbl}: ${fmt(m.val)} (${pct(m.val, total)})</title></circle>`;
    off += len;
    return seg;
  }).join('');

  const leyenda = items.map(m => `
    <div class="ledger-row">
      <span class="ledger-lbl"><span class="swatch" style="background:${m.color}"></span>${m.lbl}${cnt(m.cnt)}</span>
      <span class="ledger-fill"></span>
      <span class="ledger-val">${fmt(m.val)}</span>
      <span class="leyenda-pct">${pct(m.val, total)}</span>
    </div>`).join('');

  return `
    <div class="mix-grid">
      <svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Distribución de medios de cobro">${segs}</svg>
      <div class="ledger mix-leyenda">
        ${leyenda}
        <div class="ledger-row bold sep">
          <span class="ledger-lbl">Total vendido</span>
          <span class="ledger-fill"></span>
          <span class="ledger-val">${fmt(total)}</span>
          <span class="leyenda-pct">100 %</span>
        </div>
      </div>
    </div>`;
}

function ventasPorHoraHTML(data, t) {
  const map = {};
  (data.ventas_por_hora || []).forEach(h => { map[h.hora] = h; });
  const pad2 = n => String(n).padStart(2, '0');

  const desde = new Date(t.abierto_en);
  if (isNaN(desde)) return '';
  desde.setMinutes(0, 0, 0);
  const ahora = new Date();

  // Si el turno lleva más de 24 h abierto, mostrar la ventana de las últimas 24 horas
  const ventana = new Date(ahora);
  ventana.setMinutes(0, 0, 0);
  ventana.setHours(ventana.getHours() - 23);
  const inicio = desde > ventana ? desde : ventana;

  const cols = [];
  for (let d = new Date(inicio); d <= ahora && cols.length < 24; d.setHours(d.getHours() + 1)) {
    const key = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours());
    const h = map[key];
    cols.push({ lbl: pad2(d.getHours()), total: Number(h?.total || 0), cnt: Number(h?.cnt || 0) });
  }

  const max = Math.max(...cols.map(c => c.total), 0);
  if (max <= 0) {
    return Object.keys(map).length
      ? '<div class="chart-vacio">Sin ventas en las últimas 24 horas.</div>'
      : '<div class="chart-vacio">Sin ventas registradas en el turno todavía.</div>';
  }

  const barras = cols.map(c => {
    const alto = c.total > 0 ? Math.max(4, Math.round(c.total / max * 100)) : 0;
    return `<div class="hora-col" title="${c.lbl}:00 — ${c.cnt} op. · ${fmt(c.total)}">
      ${c.total > 0 ? `<span class="hora-val">${fmtCompacto(c.total)}</span>` : ''}
      <div class="hora-bar${c.total > 0 ? '' : ' vacia'}" style="height:${alto}%"></div>
      <span class="hora-lbl">${c.lbl}</span>
    </div>`;
  }).join('');

  return `<div class="horas-chart">${barras}</div>`;
}

// ── Modal de cierre ────────────────────────────────────────
async function abrirModal(tipo) {
  modalTipo   = tipo;
  periodoData = null;

  $('modal-titulo').textContent = tipo === 'parcial' ? 'Cierre Parcial (X)' : 'Cierre Diario (Z)';
  $('modal-subtitulo').textContent = tipo === 'parcial'
    ? 'Corte de turno. La caja continúa abierta.'
    : 'Cierre definitivo del turno. No se podrán registrar ventas hasta nueva apertura.';
  $('modal-col-izq').innerHTML = '<p class="form-hint">Cargando…</p>';
  $('modal-col-der').innerHTML = '';
  $('modal-btn-confirmar').disabled = true;
  $('modal-btn-confirmar').textContent = tipo === 'parcial' ? 'Confirmar cierre parcial' : 'Confirmar cierre diario';
  $('modal-overlay').classList.add('visible');

  const url = tipo === 'parcial'
    ? `${API}/caja-turnos/${turnoActualId}/periodo`
    : `${API}/caja-turnos/actual?caja_id=${cajaId}`;

  try {
    const res  = await fetch(url);
    const data = await res.json();

    if (tipo === 'total') {
      const t = data.turno;
      periodoData = {
        turno_id:            t.id,
        periodo_desde:       t.abierto_en,
        fondo_periodo:       Number(t.fondo_inicial),
        efectivo_esperado:   Number(t.fondo_inicial) + Number(data.total_efectivo),
        total_efectivo:      data.total_efectivo,
        total_tarjeta:       data.total_tarjeta,
        total_transferencia: data.total_transferencia,
        total_cheque:        data.total_cheque,
        total_mercado_pago:  data.total_mercado_pago,
        total_cc:            data.total_cc,
        total_ingresos:      data.total_ingresos,
        total_retiros:       data.total_retiros,
        count_efectivo:      data.count_efectivo,
        count_tarjeta:       data.count_tarjeta,
        count_transferencia: data.count_transferencia,
        count_cheque:        data.count_cheque,
        count_mercado_pago:  data.count_mercado_pago,
        count_cc:            data.count_cc,
        count_mixto:         data.count_mixto,
        count_total:         data.count_total,
        count_devoluciones:  data.count_devoluciones,
        total_devoluciones:  data.total_devoluciones,
      };
    } else {
      periodoData = data;
    }

    renderModalCols();
    $('modal-btn-confirmar').disabled = false;
  } catch (_) {
    $('modal-col-izq').innerHTML = '<p class="form-hint" style="color:var(--rojo)">Error al cargar los totales. Intentá de nuevo.</p>';
  }
}

      <div style="margin-top:10px">
        <textarea id="obs-cierre" rows="3"
          style="width:100%;padding:8px 10px;border:1px solid var(--borde);border-radius:0;font-size:12px;font-family:inherit;resize:vertical;outline:none;box-sizing:border-box"
          placeholder="Notas del cajero, incidentes, diferencias…"></textarea>
      </div>
    </div>`;

  $('ef-contado').addEventListener('input', actualizarDiferencia);
  setTimeout(() => $('ef-contado').focus(), 60);
}

function actualizarDiferencia() {
  const contado = parseFloat($('ef-contado').value);
  const row = $('dif-row');
  if (isNaN(contado) || !periodoData) { row.style.display = 'none'; return; }
  const dif = contado - periodoData.efectivo_esperado;
  row.style.display = 'flex';
  row.className = 'dif-row ' + (Math.abs(dif) < 0.01 ? 'ok' : dif < 0 ? 'falta' : 'sobra');
  $('dif-val').textContent = (dif >= 0 ? '+' : '') + fmt(dif) +
    (Math.abs(dif) < 0.01 ? '' : dif < 0 ? ' (falta)' : ' (sobra)');
  // Auto-completar fondo siguiente solo si el campo está vacío o igual al valor anterior
  const fondoEl = $('fondo-sig');
  if (fondoEl && (fondoEl.value === '' || fondoEl.dataset.autoSet === 'true')) {
    fondoEl.value = contado.toFixed(2);
    fondoEl.dataset.autoSet = 'true';
  }
}

// Si el usuario edita manualmente el fondo, desactivar el auto-complete
document.addEventListener('input', e => {
  if (e.target?.id === 'fondo-sig') {
    e.target.dataset.autoSet = 'false';
  }
});

async function confirmarCierre() {
  const ef = parseFloat($('ef-contado').value);
  if (isNaN(ef) || ef < 0) { toast('Ingresá el efectivo contado', 'err'); return; }

  const cheques         = parseFloat($('cheques-rec').value)  || 0;
  const depositos       = parseFloat($('depositos-rec').value) || 0;
  const mp_contado      = parseFloat($('mp-contado')?.value)  || null;
  const fondo_sig_raw   = parseFloat($('fondo-sig')?.value);
  const fondo_siguiente = !isNaN(fondo_sig_raw) ? fondo_sig_raw : ef;
  const observaciones   = $('obs-cierre')?.value?.trim() || null;

  const posnet_cierres = terminalesPostnet.map((t, i) => ({
    nombre: t.nombre || t,
    monto: parseFloat($(`posnet-${i}`)?.value) || 0,
  })).filter(p => p.monto > 0);

  const body = {
    efectivo_contado:     ef,
    cheques_recibidos:    cheques   || null,
    depositos_recibidos:  depositos || null,
    posnet_cierres:       posnet_cierres.length ? posnet_cierres : null,
    mercado_pago_contado: mp_contado,
    fondo_siguiente,
    observaciones,
  };

  $('modal-btn-confirmar').disabled = true;

  const url = modalTipo === 'parcial'
    ? `${API}/caja-turnos/${turnoActualId}/cierre-parcial`
    : `${API}/caja-turnos/${turnoActualId}/cerrar`;

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();

  if (!res.ok) {
    toast(data.error || 'Error al registrar el cierre', 'err');
    $('modal-btn-confirmar').disabled = false;
    return;
  }

  cerrarModal();
  toast(modalTipo === 'parcial' ? 'Cierre parcial registrado' : 'Caja cerrada');
  cargar();
}

function cerrarModal() {
  $('modal-overlay').classList.remove('visible');
  modalTipo   = null;
  periodoData = null;
}

// ── Eventos ──────────────────────────────────────────────
$('modal-close').addEventListener('click',         cerrarModal);
$('modal-btn-cancelar').addEventListener('click',  cerrarModal);
$('modal-btn-confirmar').addEventListener('click', confirmarCierre);
$('modal-overlay').addEventListener('click', e => { if (e.target === $('modal-overlay')) cerrarModal(); });

document.addEventListener('keydown', e => {
  const tag          = document.activeElement?.tagName;
  const modalVisible = $('modal-overlay').classList.contains('visible');
  if (!modalVisible && (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT')) return;
  if (modalVisible) { if (e.key === 'Escape') cerrarModal(); return; }
  if ((e.key === 'x' || e.key === 'X') && turnoActualId) { e.preventDefault(); abrirModal('parcial'); }
  if ((e.key === 'z' || e.key === 'Z') && turnoActualId) { e.preventDefault(); abrirModal('total'); }
});

cargar();

// Refresco periódico del tablero (solo con turno abierto y sin el modal en uso)
setInterval(() => {
  if (turnoActualId && !$('modal-overlay').classList.contains('visible')) cargar();
}, 60000);
</script>
</body>
</html>
