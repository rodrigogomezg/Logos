<script>
const API = '/Logos/api';
const $   = id => document.getElementById(id);
const fmt = n => '$ ' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const TIPO_COMPROBANTE_LBL = { factura_a: 'Factura A', factura_b: 'Factura B', remito: 'Remito' };
const TIPO_PAGO_LBL = { efectivo: 'Efectivo', transferencia: 'Transferencia', tarjeta: 'Tarjeta', cc: 'Cta. Corriente', mixto: 'Mixto' };

async function cargarCompras() {
  const params = new URLSearchParams();
  if ($('f-desde').value) params.set('fecha_desde', $('f-desde').value);
  if ($('f-hasta').value) params.set('fecha_hasta', $('f-hasta').value);
  params.set('limit', '200');
  const sucFiltro = $('f-sucursal') && $('f-sucursal').value;
  if (sucFiltro) params.set('sucursal_id', sucFiltro);

  const res = await fetch(`${API}/compras?${params.toString()}`);
  let compras = await res.json();

  const filtroProv = $('f-proveedor').value.trim().toLowerCase();
  if (filtroProv) {
    compras = compras.filter(c => (c.proveedor_nombre || '').toLowerCase().includes(filtroProv));
  }

  if (!compras.length) {
    $('tbody-compras').innerHTML = '';
    $('vacio').style.display = '';
    return;
  }
  $('vacio').style.display = 'none';

  $('tbody-compras').innerHTML = compras.map(c => `
    <tr class="${c.estado === 'anulado' ? 'anulada' : ''}">
      <td class="num">#${esc(c.numero)}</td>
      <td>${esc(c.fecha)}</td>
      <td>${esc(c.proveedor_nombre || '—')}</td>
      <td><span class="tipo-pill">${esc(TIPO_COMPROBANTE_LBL[c.tipo_comprobante] || c.tipo_comprobante || '—')}</span></td>
      <td class="num">${esc(c.numero_comprobante || '—')}</td>
      <td>${esc(TIPO_PAGO_LBL[c.tipo_pago] || c.tipo_pago || '—')}</td>
      <td class="total">${fmt(c.total)}</td>
      <td>${c.estado === 'anulado' ? '<span class="tipo-pill pill-anulada">Anulada</span>' : ''}</td>
      <td style="white-space:nowrap">
        <button class="btn-editar${c.estado === 'anulado' ? ' btn-ver' : ''}" data-id="${c.id}">${c.estado === 'anulado' ? 'Ver' : 'Editar'}</button>
        ${c.estado !== 'anulado' ? `<button class="btn-anular-fila" data-id="${c.id}" style="margin-left:6px">Anular</button>` : ''}
      </td>
    </tr>
  `).join('');

  $('tbody-compras').querySelectorAll('.btn-editar').forEach(btn =>
    btn.addEventListener('click', () => location.href = `compras-nueva.html?id=${btn.dataset.id}`)
  );

  $('tbody-compras').querySelectorAll('.btn-anular-fila').forEach(btn => {
    btn.addEventListener('click', () => {
      const id  = btn.dataset.id;
      const td  = btn.closest('td');
      const orig = td.innerHTML;
      td.innerHTML = `
        <div class="confirm-anular">
          <span>¿Anular?</span>
          <button class="btn-conf-si" data-id="${id}">Sí</button>
          <button class="btn-conf-no">No</button>
        </div>`;
      td.querySelector('.btn-conf-no').addEventListener('click', () => { td.innerHTML = orig; });
      td.querySelector('.btn-conf-si').addEventListener('click', async () => {
        td.querySelector('.btn-conf-si').disabled = true;
        td.querySelector('.btn-conf-si').textContent = '…';
        try {
          const res  = await fetch(`${API}/compras/${id}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Error al anular');
          cargarCompras();
        } catch (e) {
          toast_(e.message, 'err');
          td.innerHTML = orig;
        }
      });
    });
  });
}

$('btn-filtrar').addEventListener('click', cargarCompras);

(async function initSucursalFiltro() {
  try {
    const s   = JSON.parse(localStorage.getItem('logos_sesion') || '{}');
    let suc;
    if (s.rol === 'admin') {
      const r = await fetch(`${API}/sucursales`);
      suc = await r.json();
    } else {
      suc = s.sucursales || [];
    }
    if (!Array.isArray(suc) || suc.length <= 1) return;
    const sel = $('f-sucursal');
    sel.innerHTML = '<option value="">Todas</option>' + suc.map(x => `<option value="${x.id}">${x.nombre}</option>`).join('');
    $('wrap-suc-compras').style.display = '';
  } catch(e) {}
})();

(function initFechas() {
  const hoy = new Date();
  const hace30 = new Date(); hace30.setDate(hace30.getDate() - 30);
  $('f-hasta').value = fmtFecha(hoy);
  $('f-desde').value = fmtFecha(hace30);
})();

cargarCompras();
</script>
