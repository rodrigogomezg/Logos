<script>
const API = (window.APP_CONFIG?.API_BASE || '/Logos/api');
let tipoActual  = 'recibido';
let filas       = [];
let accionId    = null;
let proveedores = [];
let busqTimer   = null;

/* ── Init ─────────────────────────────────────────────────── */
(async function init() {
  const hoy = new Date().toISOString().slice(0,10);
  document.getElementById('dep-fecha').value = hoy;
  document.getElementById('end-fecha').value = hoy;
  document.getElementById('n-fecha-emision').value = hoy;
  document.getElementById('n-fecha-vencimiento').value = hoy;

  await Promise.all([cargarResumen(), cargar(), cargarProveedores()]);
})();

/* ── Tabs ─────────────────────────────────────────────────── */
function cambiarTab(tipo) {
  tipoActual = tipo;
  document.getElementById('tab-rec').classList.toggle('active', tipo === 'recibido');
  document.getElementById('tab-emi').classList.toggle('active', tipo === 'emitido');
  const sel = document.getElementById('fil-estado');
  if (tipo === 'emitido') {
    [...sel.options].forEach(o => {
      o.hidden = ['cartera','depositado','endosado'].includes(o.value);
    });
    if (['cartera','depositado','endosado'].includes(sel.value)) sel.value = '';
  } else {
    [...sel.options].forEach(o => {
      o.hidden = ['pendiente','debitado'].includes(o.value);
    });
    if (['pendiente','debitado'].includes(sel.value)) sel.value = '';
  }
  cargar();
}

/* ── API ──────────────────────────────────────────────────── */
async function cargarResumen() {
  const r = await fetch(`${API}/cheques/resumen`);
  if (!r.ok) return;
  const d = await r.json();

  const rec = d.data?.recibido ?? {};
  const emi = d.data?.emitido  ?? {};

  const cartera    = rec.cartera    ?? {cantidad:0, total:0};
  const depositado = rec.depositado ?? {cantidad:0, total:0};
  const endosado   = rec.endosado   ?? {cantidad:0, total:0};
  const emitido    = emi.pendiente  ?? {cantidad:0, total:0};

  document.getElementById('cv-cartera').textContent    = fmt(cartera.total);
  document.getElementById('cs-cartera').textContent    = pl(cartera.cantidad, 'cheque');
  document.getElementById('cv-depositados').textContent= fmt(depositado.total);
  document.getElementById('cs-depositados').textContent= pl(depositado.cantidad, 'cheque');
  document.getElementById('cv-endosados').textContent  = fmt(endosado.total);
  document.getElementById('cs-endosados').textContent  = pl(endosado.cantidad, 'cheque');
  document.getElementById('cv-emitidos').textContent   = fmt(emitido.total);
  document.getElementById('cs-emitidos').textContent   = pl(emitido.cantidad, 'cheque');

  if (d.vencidos?.cantidad > 0) {
    document.getElementById('card-vencidos').style.display = '';
    document.getElementById('cv-vencidos').textContent = fmt(d.vencidos.total);
    document.getElementById('cs-vencidos').textContent = pl(d.vencidos.cantidad, 'cheque') + ' VENCIDO';
  }
}

async function cargar() {
  document.getElementById('chq-tbody').innerHTML =
    '<tr><td colspan="8" class="chq-empty">Cargando…</td></tr>';

  const qs = new URLSearchParams({ tipo: tipoActual });
  const estado = document.getElementById('fil-estado').value;
  const q      = document.getElementById('chq-busq').value.trim();
  const desde  = document.getElementById('fil-desde').value;
  const hasta  = document.getElementById('fil-hasta').value;
  if (estado) qs.set('estado', estado);
  if (q)      qs.set('q', q);
  if (desde)  qs.set('desde', desde);
  if (hasta)  qs.set('hasta', hasta);

  const r = await fetch(`${API}/cheques?${qs}`);
  filas   = r.ok ? await r.json() : [];
  renderThead();
  renderTbody();
}

async function cargarProveedores() {
  const r = await fetch(`${API}/proveedores`);
  if (!r.ok) return;
  const d = await r.json();
  proveedores = Array.isArray(d) ? d : (d.data ?? d.proveedores ?? []);
  poblarSelProv('end-proveedor');
  poblarSelProv('n-proveedor');
}

function poblarSelProv(id) {
  const sel = document.getElementById(id);
  if (!sel) return;
  const v = sel.value;
  sel.innerHTML = '<option value="">— Seleccioná un proveedor —</option>';
  proveedores.filter(p => p.activo !== 0).forEach(p => {
    sel.appendChild(Object.assign(document.createElement('option'), { value: p.id, textContent: p.nombre }));
  });
  sel.value = v;
}

/* ── Render ───────────────────────────────────────────────── */
function renderThead() {
  const thead = document.getElementById('chq-thead');
  if (tipoActual === 'recibido') {
    thead.innerHTML = `<tr>
      <th>N° cheque</th><th>Banco</th><th>Librador</th>
      <th class="r">Monto</th><th>Emisión</th><th>Vencimiento</th>
      <th>Estado</th><th>Origen</th><th></th>
    </tr>`;
  } else {
    thead.innerHTML = `<tr>
      <th>N° cheque</th><th>Banco</th><th>Beneficiario</th>
      <th class="r">Monto</th><th>Emisión</th><th>Vencimiento</th>
      <th>Estado</th><th>Proveedor</th><th></th>
    </tr>`;
  }
}

function renderTbody() {
  const tb  = document.getElementById('chq-tbody');
  const cols = tipoActual === 'recibido' ? 9 : 9;
  if (!filas.length) {
    tb.innerHTML = `<tr><td colspan="${cols}" class="chq-empty">No hay cheques para mostrar.</td></tr>`;
    return;
  }
  tb.innerHTML = filas.map(f => rowHtml(f)).join('');
}

function rowHtml(f) {
  const hoy   = new Date().toISOString().slice(0,10);
  const venc  = f.fecha_vencimiento;
  const diff  = Math.floor((new Date(venc) - new Date(hoy)) / 86400000);
  const vCls  = diff < 0 ? 'venc-venc' : diff <= 7 ? 'venc-prox' : 'venc-ok';

  const badge = `<span class="estado-badge est-${esc(f.estado)}">${esc(f.estado)}</span>`;
  const monto = fmt(f.monto);
  const emis  = f.fecha_emision   ? fmtFecha(f.fecha_emision)   : '—';
  const vencS = fmtFecha(venc);

  let origen = '—';
  if (tipoActual === 'recibido') {
    if (f.venta_id)    origen = `<span class="orig-badge">Venta #${f.venta_id}</span>`;
    else if (f.cliente_nombre) origen = `<span class="orig-badge">${esc(f.cliente_nombre)}</span>`;
    else if (f.cc_movimiento_id) origen = `<span class="orig-badge">CC mov. #${f.cc_movimiento_id}</span>`;
  }

  const tercero = tipoActual === 'recibido'
    ? esc(f.librador  || '—')
    : esc(f.beneficiario || f.proveedor_nombre || '—');

  const extra = tipoActual === 'recibido'
    ? `<td>${origen}</td>`
    : `<td><span class="orig-badge">${esc(f.proveedor_nombre || '—')}</span></td>`;

  const acciones = buildAcciones(f);

  return `<tr>
    <td class="td-mono">${esc(f.numero)}</td>
    <td>${esc(f.banco)}</td>
    <td>${tercero}</td>
    <td class="r td-monto">${monto}</td>
    <td>${emis}</td>
    <td class="${vCls}">${vencS}${diff < 0 && f.estado === 'cartera' ? ' <small>(vencido)</small>' : diff <= 7 && diff >= 0 && f.estado === 'cartera' ? ' <small>(próximo)</small>' : ''}</td>
    <td>${badge}</td>
    ${extra}
    <td class="td-act">${acciones}</td>
  </tr>`;
}

function buildAcciones(f) {
  const btns = [];
  if (f.tipo === 'recibido') {
    if (f.estado === 'cartera') {
      btns.push(btn('Depositar','depositar', f.id, 'btn-depositar'));
      btns.push(btn('Endosar','endosar',    f.id, 'btn-endosar'));
      btns.push(btn('Rechazar','rechazar',  f.id, 'btn-rechazar'));
      btns.push(btn('✕','eliminar',          f.id, 'btn-del'));
    } else if (['depositado','rechazado'].includes(f.estado)) {
      btns.push(btn('Reactivar','reactivar', f.id, 'btn-reactivar'));
    } else if (f.estado === 'endosado') {
      btns.push(btn('Reactivar','reactivar', f.id, 'btn-reactivar'));
    }
  } else {
    if (f.estado === 'pendiente') {
      btns.push(btn('Debitado','debitado',  f.id, 'btn-debitado'));
      btns.push(btn('Rechazar','rechazar',  f.id, 'btn-rechazar'));
      btns.push(btn('✕','eliminar',          f.id, 'btn-del'));
    } else if (['debitado','rechazado'].includes(f.estado)) {
      btns.push(btn('Reactivar','reactivar', f.id, 'btn-reactivar'));
    }
  }
  return btns.join(' ');
}

function btn(label, accion, id, cls) {
  return `<button class="btn-accion ${cls}" onclick="accion('${accion}',${id})">${label}</button>`;
}

/* ── Acciones ─────────────────────────────────────────────── */
async function accion(tipo, id) {
  accionId = id;
  const f  = filas.find(x => x.id === id);
  if (!f) return;

  if (tipo === 'depositar') {
    document.getElementById('dep-info').innerHTML =
      `Cheque N° <strong>${esc(f.numero)}</strong> — ${esc(f.banco)}<strong>${fmt(f.monto)}</strong>`;
    document.getElementById('dep-banco').value = '';
    abrir('ov-depositar');
    setTimeout(() => document.getElementById('dep-banco').focus(), 80);

  } else if (tipo === 'endosar') {
    document.getElementById('end-info').innerHTML =
      `Cheque N° <strong>${esc(f.numero)}</strong> — ${esc(f.banco)}<strong>${fmt(f.monto)}</strong>`;
    document.getElementById('end-proveedor').value = '';
    document.getElementById('end-obs').value = '';
    abrir('ov-endosar');

  } else if (tipo === 'rechazar') {
    const ok = await confirmarModal(`¿Marcar como rechazado el cheque N° ${f.numero} por ${fmt(f.monto)}?`,
      { confirmLabel: 'Rechazar', danger: true });
    if (!ok) return;
    const r = await fetch(`${API}/cheques/${id}/rechazar`, { method:'POST' });
    if (r.ok) { toast_('Cheque marcado como rechazado'); recargar(); }
    else       toast_('Error al rechazar', 'err');

  } else if (tipo === 'debitado') {
    const ok = await confirmarModal(`¿Confirmar que el cheque N° ${f.numero} fue debitado de la cuenta?`,
      { confirmLabel: 'Confirmar débito' });
    if (!ok) return;
    const r = await fetch(`${API}/cheques/${id}/debitado`, { method:'POST' });
    if (r.ok) { toast_('Cheque marcado como debitado'); recargar(); }
    else       toast_('Error', 'err');

  } else if (tipo === 'reactivar') {
    const ok = await confirmarModal(
      `¿Reactivar el cheque N° ${f.numero}? Volverá al estado ${f.tipo === 'recibido' ? 'cartera' : 'pendiente'}.`,
      { confirmLabel: 'Reactivar' });
    if (!ok) return;
    const r = await fetch(`${API}/cheques/${id}/reactivar`, { method:'POST' });
    if (!r.ok) { const d = await r.json(); toast_(d.error || 'Error', 'err'); return; }
    toast_('Cheque reactivado'); recargar();

  } else if (tipo === 'eliminar') {
    const ok = await confirmarModal(`¿Eliminar el cheque N° ${f.numero}?`,
      { confirmLabel: 'Eliminar', danger: true });
    if (!ok) return;
    const r = await fetch(`${API}/cheques/${id}`, { method:'DELETE' });
    if (!r.ok) { const d = await r.json(); toast_(d.error || 'Error', 'err'); return; }
    toast_('Cheque eliminado'); recargar();
  }
}

async function confirmarDepositar() {
  const banco = document.getElementById('dep-banco').value.trim();
  const fecha = document.getElementById('dep-fecha').value;
  if (!banco) { document.getElementById('dep-banco').focus(); return; }

  const r = await fetch(`${API}/cheques/${accionId}/depositar`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ banco_destino: banco, fecha_deposito: fecha })
  });
  if (!r.ok) { const d = await r.json(); toast_(d.error || 'Error', 'err'); return; }
  cerrar('ov-depositar');
  toast_('Cheque depositado correctamente');
  recargar();
}

async function confirmarEndosar() {
  const provId = document.getElementById('end-proveedor').value;
  const fecha  = document.getElementById('end-fecha').value;
  const obs    = document.getElementById('end-obs').value.trim();
  if (!provId) { document.getElementById('end-proveedor').focus(); return; }

  const r = await fetch(`${API}/cheques/${accionId}/endosar`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ proveedor_id: parseInt(provId), fecha, observaciones: obs })
  });
  const d = await r.json();
  if (!r.ok) { toast_(d.error || 'Error', 'err'); return; }
  cerrar('ov-endosar');
  toast_(`Cheque endosado a ${d.proveedor}`);
  recargar();
}

/* ── Nuevo cheque ─────────────────────────────────────────── */
function onTipoChange() {
  const tipo = document.getElementById('n-tipo').value;
  document.getElementById('wrap-n-librador').style.display   = tipo === 'recibido' ? '' : 'none';
  document.getElementById('wrap-n-beneficiario').style.display = tipo === 'emitido'  ? '' : 'none';
  document.getElementById('wrap-n-proveedor').style.display  = tipo === 'emitido'  ? '' : 'none';
  document.getElementById('nuevo-titulo').textContent =
    tipo === 'recibido' ? 'Nuevo cheque recibido' : 'Nuevo cheque emitido';
}

function abrirNuevo() {
  const tipo = tipoActual;
  document.getElementById('n-tipo').value = tipo;
  onTipoChange();
  ['n-numero','n-banco','n-librador','n-beneficiario','n-cuit','n-notas'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('n-monto').value = '';
  const hoy = new Date().toISOString().slice(0,10);
  document.getElementById('n-fecha-emision').value = hoy;
  document.getElementById('n-fecha-vencimiento').value = hoy;
  document.getElementById('n-proveedor').value = '';
  abrir('ov-nuevo');
  setTimeout(() => document.getElementById('n-numero').focus(), 80);
}
function cerrarNuevo() { cerrar('ov-nuevo'); }

async function guardarNuevo() {
  const tipo    = document.getElementById('n-tipo').value;
  const numero  = document.getElementById('n-numero').value.trim();
  const banco   = document.getElementById('n-banco').value.trim();
  const monto   = parseFloat(document.getElementById('n-monto').value);
  const fvenc   = document.getElementById('n-fecha-vencimiento').value;

  if (!numero) { toast_('Ingresá el número de cheque', 'err'); return; }
  if (!banco)  { toast_('Ingresá el banco', 'err'); return; }
  if (!monto || monto <= 0) { toast_('Ingresá un monto válido', 'err'); return; }
  if (!fvenc)  { toast_('Ingresá la fecha de vencimiento', 'err'); return; }

  const body = {
    tipo, numero, banco, monto,
    fecha_emision:     document.getElementById('n-fecha-emision').value  || null,
    fecha_vencimiento: fvenc,
    librador:          document.getElementById('n-librador').value.trim()    || null,
    beneficiario:      document.getElementById('n-beneficiario').value.trim()|| null,
    cuit:              document.getElementById('n-cuit').value.trim()        || null,
    notas:             document.getElementById('n-notas').value.trim()       || null,
    proveedor_id:      document.getElementById('n-proveedor').value ? parseInt(document.getElementById('n-proveedor').value) : null,
  };

  const btn = document.getElementById('btn-guardar-nuevo');
  btn.disabled = true;
  const r = await fetch(`${API}/cheques`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  btn.disabled = false;
  const d = await r.json();
  if (!r.ok) { toast_(d.error || 'Error al guardar', 'err'); return; }
  cerrarNuevo();
  toast_('Cheque guardado correctamente');
  recargar();
}

/* ── Helpers ──────────────────────────────────────────────── */
async function recargar() {
  await Promise.all([cargarResumen(), cargar()]);
}

let busqTimer2;
function buscar(q) {
  clearTimeout(busqTimer2);
  busqTimer2 = setTimeout(() => cargar(), 280);
}

function abrir(id)  { document.getElementById(id).classList.add('open'); }
function cerrar(id) { document.getElementById(id).classList.remove('open'); }

function fmt(n) {
  if (n == null) return '—';
  return '$ ' + parseFloat(n).toLocaleString('es-AR', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtFecha(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}
function pl(n, w) { return `${n} ${w}${n !== 1 ? 's' : ''}`; }
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
