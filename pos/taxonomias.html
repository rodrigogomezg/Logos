<script>
const API = (window.APP_CONFIG?.API_BASE || '/Logos/api') + '/taxonomias';
let tipoActual = 'rubros';
let filas      = [];
let selIds     = new Set();
let renombrando = null; // id being renamed

/* ── Init ─────────────────────────────────────────────────── */
(function init() {
  const p = new URLSearchParams(location.search);
  const t = p.get('tipo');
  cambiarTipo(t === 'marcas' ? 'marcas' : 'rubros');
})();

function cambiarTipo(tipo) {
  tipoActual = tipo;
  document.getElementById('tax-titulo').textContent = tipo === 'rubros' ? 'Rubros' : 'Marcas';
  document.getElementById('tab-rubros').classList.toggle('active', tipo === 'rubros');
  document.getElementById('tab-marcas').classList.toggle('active', tipo === 'marcas');
  document.getElementById('tax-busq').value = '';
  selIds.clear();
  actualizarSelBar();
  history.replaceState(null, '', '?tipo=' + tipo);
  cargar();
}

/* ── API calls ───────────────────────────────────────────── */
async function cargar(q = '') {
  document.getElementById('tax-tbody').innerHTML =
    '<tr><td colspan="5" class="tax-loading">Cargando…</td></tr>';
  const url = API + '?tipo=' + tipoActual + (q ? '&q=' + encodeURIComponent(q) : '');
  const [r] = await Promise.all([fetch(url), cargarReglasPrecio()]);
  filas     = r.ok ? await r.json() : [];
  renderTabla();
}

/* ── Reglas de precio (para el select de cada fila) ─────────── */
let _reglasPrecio = [];
async function cargarReglasPrecio() {
  if (_reglasPrecio.length) return;
  try {
    const r = await fetch((window.APP_CONFIG?.API_BASE || '/Logos/api') + '/reglas-precio?activas=1');
    _reglasPrecio = r.ok ? await r.json() : [];
  } catch { _reglasPrecio = []; }
}
function reglaSelectHtml(f) {
  const opciones = ['<option value="">— Sin regla —</option>']
    .concat(_reglasPrecio.map(rg => `<option value="${rg.id}" ${rg.id === f.regla_precio_id ? 'selected' : ''}>${esc(rg.nombre)} (+${rg.porcentaje_recargo}%)</option>`));
  return `<select class="t-input" onchange="cambiarRegla(${f.id}, this.value)">${opciones.join('')}</select>`;
}
async function cambiarRegla(id, reglaId) {
  const f = filas.find(x => x.id === id);
  if (!f) return;
  const r = await fetch(API + '/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tipo: tipoActual, nombre: f.nombre, regla_precio_id: reglaId ? parseInt(reglaId) : null })
  });
  const data = await r.json();
  if (!r.ok) { mostrarToast(data.error || 'Error al asignar la regla', 'error'); cargar(document.getElementById('tax-busq').value); return; }
  mostrarToast('Regla actualizada — los productos ya recalcularon su precio');
  cargar(document.getElementById('tax-busq').value);
}

function renderTabla() {
  const tb = document.getElementById('tax-tbody');
  document.getElementById('tax-count').textContent =
    filas.length ? filas.length + ' ' + (filas.length === 1 ? 'elemento' : 'elementos') : '';
  document.getElementById('chk-all').checked = false;

  if (!filas.length) {
    tb.innerHTML = '<tr><td colspan="5" class="tax-empty">No hay elementos. Agregá el primero.</td></tr>';
    return;
  }
  tb.innerHTML = filas.map(f => rowHtml(f)).join('');
}

function rowHtml(f) {
  const sel = selIds.has(f.id);
  if (renombrando === f.id) {
    return `<tr data-id="${f.id}">
      <td><input type="checkbox" class="row-chk" value="${f.id}" ${sel ? 'checked' : ''}
          onchange="toggleSel(${f.id}, this.checked)"></td>
      <td colspan="4">
        <div class="tax-rename-form">
          <input type="text" class="t-input tax-rename-inp" id="ren-${f.id}"
                 value="${esc(f.nombre)}" maxlength="100"
                 onkeydown="if(event.key==='Enter') confirmarRename(${f.id}); if(event.key==='Escape') cancelarRename()">
          <button class="btn btn-ok btn-xs" onclick="confirmarRename(${f.id})">✓</button>
          <button class="btn btn-sec btn-xs" onclick="cancelarRename()">✕</button>
        </div>
      </td>
    </tr>`;
  }
  return `<tr data-id="${f.id}">
    <td><input type="checkbox" class="row-chk" value="${f.id}" ${sel ? 'checked' : ''}
        onchange="toggleSel(${f.id}, this.checked)"></td>
    <td class="td-nom">${esc(f.nombre)}</td>
    <td class="td-prod">${f.productos || 0}</td>
    <td>${reglaSelectHtml(f)}</td>
    <td class="td-act">
      <button class="btn btn-sec btn-xs" title="Renombrar"
              onclick="iniciarRename(${f.id})">✎</button>
      <button class="btn btn-danger btn-xs" title="Eliminar"
              onclick="eliminarUno(${f.id}, '${esc(f.nombre)}', ${f.productos})">✕</button>
    </td>
  </tr>`;
}

/* ── Search ──────────────────────────────────────────────── */
let busqTimer;
function buscar(q) {
  clearTimeout(busqTimer);
  busqTimer = setTimeout(() => cargar(q), 260);
}

/* ── Selection ───────────────────────────────────────────── */
function toggleSel(id, checked) {
  checked ? selIds.add(id) : selIds.delete(id);
  actualizarSelBar();
}
function toggleAll(checked) {
  filas.forEach(f => checked ? selIds.add(f.id) : selIds.delete(f.id));
  document.querySelectorAll('.row-chk').forEach(c => { c.checked = checked; });
  actualizarSelBar();
}
function actualizarSelBar() {
  const n   = selIds.size;
  const bar = document.getElementById('tax-sel-bar');
  bar.classList.toggle('visible', n > 0);
  document.getElementById('tax-sel-txt').textContent =
    n + ' ' + (n === 1 ? 'elemento seleccionado' : 'elementos seleccionados');
}

/* ── Rename ──────────────────────────────────────────────── */
function iniciarRename(id) {
  renombrando = id;
  renderTabla();
  setTimeout(() => { const el = document.getElementById('ren-' + id); if (el) { el.focus(); el.select(); } }, 50);
}
function cancelarRename() {
  renombrando = null;
  renderTabla();
}
async function confirmarRename(id) {
  const inp    = document.getElementById('ren-' + id);
  const nombre = inp.value.trim();
  if (!nombre) { inp.focus(); return; }

  const r = await fetch(API + '/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tipo: tipoActual, nombre })
  });
  const data = await r.json();
  if (!r.ok) { mostrarToast(data.error || 'Error al renombrar', 'error'); return; }

  renombrando = null;
  mostrarToast('Renombrado correctamente');
  cargar(document.getElementById('tax-busq').value);
}

/* ── Create one ──────────────────────────────────────────── */
async function crearUno() {
  const inp    = document.getElementById('add-nombre');
  const nombre = inp.value.trim();
  if (!nombre) { inp.focus(); return; }

  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tipo: tipoActual, nombre })
  });
  const data = await r.json();
  if (!r.ok) { mostrarToast(data.error || 'Error al agregar', 'error'); return; }

  inp.value = '';
  mostrarToast('Agregado correctamente');
  cargar(document.getElementById('tax-busq').value);
}

/* ── Bulk add ────────────────────────────────────────────── */
function toggleBulkPanel() {
  const p = document.getElementById('tax-bulk-panel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) document.getElementById('bulk-txt').focus();
}
async function bulkCrear() {
  const txt    = document.getElementById('bulk-txt').value;
  const nombres = txt.split('\n').map(s => s.trim()).filter(Boolean);
  if (!nombres.length) return;

  const r = await fetch(API + '/bulk', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tipo: tipoActual, nombres })
  });
  const data = await r.json();
  if (!r.ok) { mostrarToast(data.error || 'Error', 'error'); return; }

  document.getElementById('bulk-txt').value = '';
  toggleBulkPanel();
  mostrarToast('Creados: ' + data.creados + (data.omitidos ? ', omitidos (ya existen): ' + data.omitidos : ''));
  cargar(document.getElementById('tax-busq').value);
}

/* ── Delete one ──────────────────────────────────────────── */
async function eliminarUno(id, nombre, nProductos) {
  const aviso = nProductos > 0
    ? `"${nombre}" está asignado a ${nProductos} producto${nProductos > 1 ? 's' : ''}. Se quitará de esos productos.`
    : `¿Eliminar "${nombre}"?`;
  const ok = await confirmarModal(aviso, { confirmLabel: 'Eliminar', danger: true });
  if (!ok) return;

  const r = await fetch(API + '/' + id + '?tipo=' + tipoActual, { method: 'DELETE' });
  if (!r.ok) { const d = await r.json(); mostrarToast(d.error || 'Error', 'error'); return; }
  mostrarToast('Eliminado');
  selIds.delete(id);
  actualizarSelBar();
  cargar(document.getElementById('tax-busq').value);
}

/* ── Bulk delete ─────────────────────────────────────────── */
async function bulkEliminar() {
  const ids = [...selIds];
  if (!ids.length) return;

  const afectados = filas.filter(f => ids.includes(f.id) && f.productos > 0);
  let msg = `¿Eliminar ${ids.length} ${ids.length === 1 ? 'elemento' : 'elementos'}?`;
  if (afectados.length) msg += ` ${afectados.length} de ellos tienen productos asignados (se quitará la referencia).`;

  const ok = await confirmarModal(msg, { confirmLabel: 'Eliminar', danger: true });
  if (!ok) return;

  const r = await fetch(API + '/bulk-eliminar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tipo: tipoActual, ids })
  });
  const data = await r.json();
  if (!r.ok) { mostrarToast(data.error || 'Error', 'error'); return; }
  selIds.clear();
  actualizarSelBar();
  mostrarToast('Eliminados: ' + data.eliminados);
  cargar(document.getElementById('tax-busq').value);
}

/* ── Helpers ─────────────────────────────────────────────── */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function mostrarToast(msg, tipo = 'ok') {
  toast_(msg, tipo === 'error' ? 'err' : tipo);
}
</script>
