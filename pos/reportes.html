<script>
const API = window.CONFIG?.apiBase ?? '/Logos/api';
let vistaActual = 'resumen-ejecutivo';
let charts = {};
let datosRotacion = [];

const hoy = new Date();
document.getElementById('tb-desde').value = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-01`;
document.getElementById('tb-hasta').value = hoy.toISOString().slice(0,10);

function setVista(v, btn) {
  vistaActual = v;
  document.querySelectorAll('.tab-vista').forEach(b => b.classList.toggle('activo', b === btn));
  const esRot  = v === 'rotacion-inventario';
  const esFlujo = v === 'flujo-caja';
  document.getElementById('sep-extra').style.display      = (esRot || esFlujo) ? '' : 'none';
  document.getElementById('lbl-extra').style.display      = (esRot || esFlujo) ? '' : 'none';
  document.getElementById('inp-categoria').style.display  = esRot   ? '' : 'none';
  document.getElementById('sel-agrupar').style.display    = esFlujo ? '' : 'none';
  document.getElementById('lbl-extra').textContent        = esRot ? 'Categoría' : 'Agrupar';
  cargarVista();
}

function pesos(n, corto) {
  if (corto && Math.abs(n) >= 1000000) return '$ ' + (n/1000000).toFixed(1) + 'M';
  if (corto && Math.abs(n) >= 1000)    return '$ ' + (n/1000).toFixed(1) + 'k';
  return '$ ' + Number(n).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function num(n) { return Number(n).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

function destroyCharts() { Object.values(charts).forEach(c => c.destroy()); charts = {}; }

function colorSet(n) {
  const p = ['#4F8EF7','#27AE60','#E74C3C','#F39C12','#9B59B6','#1ABC9C','#E67E22','#2980B9','#C0392B','#16A085'];
  return Array.from({length: n}, (_, i) => p[i % p.length]);
}

function setKpis(cards) {
  // cards = [{lbl, val, cls?, dtl?}, ...]
  cards.forEach((c, i) => {
    document.getElementById('kl'+i).textContent = c.lbl;
    const kv = document.getElementById('k'+i);
    kv.textContent = c.val;
    kv.className = 'kval' + (c.cls ? ' ' + c.cls : '');
    document.getElementById('kd'+i).textContent = c.dtl ?? '';
  });
}

async function cargarVista() {
  destroyCharts();
  datosRotacion = [];
  const cnt = document.getElementById('contenido');
  cnt.innerHTML = '<div class="empty">Cargando…</div>';
  const desde = document.getElementById('tb-desde').value;
  const hasta  = document.getElementById('tb-hasta').value;
  if (!desde || !hasta) { cnt.innerHTML = ''; return; }
  try {
    if (vistaActual === 'resumen-ejecutivo')   await cargarResumen(cnt, desde, hasta);
    if (vistaActual === 'rotacion-inventario') await cargarRotacion(cnt, desde, hasta);
    if (vistaActual === 'compras-proveedor')   await cargarCompras(cnt, desde, hasta);
    if (vistaActual === 'flujo-caja')          await cargarFlujo(cnt, desde, hasta);
  } catch (e) {
    cnt.innerHTML = `<div class="empty">Error al cargar datos: ${esc(e.message)}</div>`;
  }
}

function exportar() {
  const desde = document.getElementById('tb-desde').value;
  const hasta  = document.getElementById('tb-hasta').value;
  let url = `${API}/reportes/exportar?tipo=${vistaActual}&desde=${desde}&hasta=${hasta}`;
  const cat = document.getElementById('inp-categoria').value.trim();
  if (vistaActual === 'rotacion-inventario' && cat) url += `&categoria=${encodeURIComponent(cat)}`;
  if (vistaActual === 'flujo-caja') url += `&agrupar=${document.getElementById('sel-agrupar').value}`;
  window.location.href = url;
}

// ── Resumen ejecutivo ──────────────────────────────────────────────────
async function cargarResumen(cnt, desde, hasta) {
  const data = await apiFetch(`${API}/reportes/resumen-ejecutivo?desde=${desde}&hasta=${hasta}`);

  const balance = data.balance ?? 0;
  setKpis([
    { lbl: 'Ventas del período',   val: pesos(data.ventas,        true) },
    { lbl: 'Compras del período',  val: pesos(data.total_compras, true) },
    { lbl: 'Ganancia bruta',       val: pesos(data.ganancia_bruta,true), cls: data.ganancia_bruta >= 0 ? 'g' : 'd' },
    { lbl: 'Balance operativo',    val: pesos(balance,            true), cls: balance >= 0 ? 'g' : 'd',
      dtl: `Margen ${data.margen_pct}%` },
  ]);

  const porDia = data.por_dia || [];
  const cobros = data.cobros_tipo || {};
  const labelsCobros = {
    efectivo: 'Efectivo', transferencia: 'Transferencia', tarjeta: 'Tarjeta',
    cc: 'Cta. Cte.', mercado_pago: 'Mercado Pago', cheque: 'Cheque', mixto: 'Mixto',
  };

  const chipsHtml = Object.entries(cobros)
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<span class="pago-chip">${labelsCobros[k] ?? k}: <b>${pesos(v, true)}</b></span>`)
    .join('');

  const filasDia = porDia.map(d => `
    <tr>
      <td>${d.dia}</td>
      <td class="r muted">${d.cant}</td>
      <td class="r">${pesos(d.monto, false)}</td>
    </tr>`).join('');

  cnt.innerHTML = `
    <div class="grid2">
      <div class="bloque">
        <div class="bh"><span class="bt">Ventas por día</span><span class="bs">${porDia.length} días con actividad</span></div>
        <div class="chart-pad"><canvas id="chart-dias"></canvas></div>
      </div>
      <div class="bloque">
        <div class="bh"><span class="bt">Cobros por medio de pago</span></div>
        <div class="pago-tipo">${chipsHtml || '<span class="empty" style="padding:8px">Sin datos</span>'}</div>
        <div class="bh" style="border-top:1px solid rgba(163,177,198,.3);border-bottom:none;margin-top:8px">
          <span class="bt">Detalle diario</span>
        </div>
        <div class="tabla-wrap">
          <table>
            <thead><tr><th>Fecha</th><th class="r">Ops.</th><th class="r">Monto</th></tr></thead>
            <tbody>${filasDia || '<tr><td colspan="3" class="empty">Sin ventas en el período.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    </div>`;

  if (porDia.length) {
    charts['dias'] = new Chart(document.getElementById('chart-dias'), {
      type: 'bar',
      data: {
        labels: porDia.map(d => d.dia),
        datasets: [{
          label: 'Ventas', data: porDia.map(d => d.monto),
          backgroundColor: 'rgba(155,27,46,.65)', borderRadius: 3,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { font:{size:9}, color:'#a3b1c6', maxRotation:45 }, grid:{display:false} },
          y: { ticks: { font:{size:9}, color:'#a3b1c6', callback: v => pesos(v,true) }, grid:{color:'rgba(163,177,198,.15)'} },
        }
      }
    });
  }
}

// ── Rotación de inventario ─────────────────────────────────────────────
async function cargarRotacion(cnt, desde, hasta) {
  const cat = document.getElementById('inp-categoria').value.trim();
  let url = `${API}/reportes/rotacion-inventario?desde=${desde}&hasta=${hasta}`;
  if (cat) url += `&categoria=${encodeURIComponent(cat)}`;
  const data = await apiFetch(url);
  datosRotacion = data.productos || [];
  const tot = data.totales || {};

  setKpis([
    { lbl: 'Unidades vendidas',   val: num(tot.unidades ?? 0),       dtl: `${tot.productos ?? 0} productos` },
    { lbl: 'Ingresos generados',  val: pesos(tot.ingresos ?? 0, true) },
    { lbl: 'Sin movimiento',      val: String(tot.sin_movimiento ?? 0), dtl: 'productos sin ventas' },
    { lbl: 'En quiebre de stock', val: String(tot.en_quiebre ?? 0),    dtl: 'stock ≤ mínimo' },
  ]);

  renderTablaRotacion(cnt, datosRotacion);
}

function filtrarRotacion() {
  const cat = document.getElementById('inp-categoria').value.trim().toLowerCase();
  const filtrados = cat ? datosRotacion.filter(p => (p.categoria || '').toLowerCase().includes(cat)) : datosRotacion;
  renderTablaRotacion(document.getElementById('contenido'), filtrados);
}

function rotBar(val, max) {
  const pct = max > 0 ? Math.min(100, (val / max) * 100) : 0;
  return `<div class="rot-bar"><div class="rot-track"><div class="rot-fill" style="width:${pct.toFixed(1)}%"></div></div><span class="rot-val">${val != null ? val.toFixed(2) : '—'}</span></div>`;
}

function renderTablaRotacion(cnt, prods) {
  const maxRot = Math.max(...prods.map(p => p.indice_rotacion ?? 0), 0.01);
  const filas = prods.map(p => {
    const badge = p.unidades_vendidas > 0
      ? `<span class="badge badge-ok">Activo</span>`
      : `<span class="badge badge-zero">Sin mov.</span>`;
    return `<tr>
      <td>${esc(p.nombre)}</td>
      <td class="muted">${esc(p.categoria)}</td>
      <td class="muted">${esc(p.marca)}</td>
      <td class="r">${p.unidades_vendidas % 1 === 0 ? p.unidades_vendidas : p.unidades_vendidas.toFixed(2)}</td>
      <td class="r">${pesos(p.ingresos, true)}</td>
      <td class="r muted">${p.stock_actual % 1 === 0 ? p.stock_actual : p.stock_actual.toFixed(2)}</td>
      <td>${rotBar(p.indice_rotacion, maxRot)}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');

  cnt.innerHTML = `
    <div class="bloque">
      <div class="bh">
        <span class="bt">Rotación de inventario</span>
        <span class="bs">${prods.length} productos</span>
      </div>
      <div class="tabla-wrap" style="max-height:none">
        <table>
          <thead><tr>
            <th>Nombre</th><th>Categoría</th><th>Marca</th>
            <th class="r">Uds. vendidas</th><th class="r">Ingresos</th>
            <th class="r">Stock actual</th><th>Índice rotación</th><th>Estado</th>
          </tr></thead>
          <tbody>${filas || '<tr><td colspan="8" class="empty">Sin productos.</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

// ── Compras por proveedor ──────────────────────────────────────────────
async function cargarCompras(cnt, desde, hasta) {
  const data = await apiFetch(`${API}/reportes/compras-proveedor?desde=${desde}&hasta=${hasta}`);
  const tot  = data.totales || {};
  const filas = data.filas || [];
  const conCompras = filas.filter(f => f.cantidad_ordenes > 0).length;

  setKpis([
    { lbl: 'Total comprado',      val: pesos(tot.total ?? 0, true) },
    { lbl: 'Órdenes de compra',   val: String(tot.ordenes ?? 0) },
    { lbl: 'IVA crédito fiscal',  val: pesos(tot.iva ?? 0, true) },
    { lbl: 'Proveedores activos', val: String(conCompras), dtl: `de ${filas.length} en catálogo` },
  ]);

  const rows = filas.map(f => `
    <tr>
      <td>${esc(f.nombre)}</td>
      <td class="muted">${esc(f.cuit)}</td>
      <td class="r muted">${f.cantidad_ordenes}</td>
      <td class="r">${pesos(f.subtotal, true)}</td>
      <td class="r muted">${pesos(f.iva, true)}</td>
      <td class="r">${pesos(f.total, true)}</td>
      <td class="muted">${f.primera ?? '—'}</td>
      <td class="muted">${f.ultima ?? '—'}</td>
      <td class="r ${f.saldo_cuenta_corriente > 0 ? '' : 'muted'}">${pesos(f.saldo_cuenta_corriente, true)}</td>
    </tr>`).join('');

  cnt.innerHTML = `
    <div class="bloque">
      <div class="bh">
        <span class="bt">Compras por proveedor</span>
        <span class="bs">${conCompras} proveedores con compras en el período</span>
      </div>
      <div class="tabla-wrap" style="max-height:none">
        <table>
          <thead><tr>
            <th>Proveedor</th><th>CUIT</th><th class="r">Órdenes</th>
            <th class="r">Subtotal</th><th class="r">IVA</th><th class="r">Total</th>
            <th>Primera</th><th>Última</th><th class="r">Saldo CC</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="9" class="empty">Sin compras en el período.</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

// ── Flujo de caja ──────────────────────────────────────────────────────
async function cargarFlujo(cnt, desde, hasta) {
  const agrupar = document.getElementById('sel-agrupar').value;
  const data    = await apiFetch(`${API}/reportes/flujo-caja?desde=${desde}&hasta=${hasta}&agrupar=${agrupar}`);
  const tot     = data.totales || {};
  const serie   = data.serie   || [];

  const saldo = tot.saldo_neto ?? 0;
  setKpis([
    { lbl: 'Ventas cobradas',      val: pesos(tot.ingresos      ?? 0, true) },
    { lbl: 'Cobros / Ingr. caja',  val: pesos(tot.ingresos_caja ?? 0, true) },
    { lbl: 'Egresos (compras)',     val: pesos(tot.egresos       ?? 0, true) },
    { lbl: 'Saldo neto',            val: pesos(saldo, true), cls: saldo >= 0 ? 'g' : 'd' },
  ]);

  if (!serie.length) {
    cnt.innerHTML = '<div class="empty">Sin movimientos en el período.</div>';
    return;
  }

  const filas = serie.map(s => {
    const negativo = s.saldo_neto < 0;
    return `<tr>
      <td>${esc(s.periodo)}</td>
      <td class="r">${pesos(s.ingresos,      true)}</td>
      <td class="r">${pesos(s.ingresos_caja, true)}</td>
      <td class="r muted">${pesos(s.egresos,  true)}</td>
      <td class="r muted">${pesos(s.retiros,  true)}</td>
      <td class="r" style="${negativo ? 'color:var(--neo-danger);font-weight:700' : ''}">${pesos(s.saldo_neto, true)}</td>
      <td class="r" style="${s.saldo_acum < 0 ? 'color:var(--neo-danger);font-weight:700' : 'color:var(--neo-success);font-weight:700'}">${pesos(s.saldo_acum, true)}</td>
    </tr>`;
  }).join('');

  cnt.innerHTML = `
    <div class="bloque">
      <div class="bh"><span class="bt">Flujo de caja — ${agrupar === 'dia' ? 'por día' : agrupar === 'semana' ? 'por semana' : 'por mes'}</span></div>
      <div class="chart-pad" style="height:260px"><canvas id="chart-flujo"></canvas></div>
    </div>
    <div class="bloque">
      <div class="bh"><span class="bt">Serie detallada</span><span class="bs">${serie.length} períodos</span></div>
      <div class="tabla-wrap" style="max-height:none">
        <table>
          <thead><tr>
            <th>Período</th><th class="r">Ventas cobr.</th><th class="r">Cobros/Ingr.</th>
            <th class="r">Egresos</th><th class="r">Retiros</th>
            <th class="r">Saldo neto</th><th class="r">Saldo acum.</th>
          </tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>`;

  const labels = serie.map(s => s.periodo);
  charts['flujo'] = new Chart(document.getElementById('chart-flujo'), {
    data: {
      labels,
      datasets: [
        {
          type: 'bar', label: 'Ventas cobradas',
          data: serie.map(s => s.ingresos),
          backgroundColor: 'rgba(39,174,96,.65)', borderRadius: 3, yAxisID: 'y',
        },
        {
          type: 'bar', label: 'Cobros/Ingr. caja',
          data: serie.map(s => s.ingresos_caja),
          backgroundColor: 'rgba(39,174,96,.35)', borderRadius: 3, yAxisID: 'y',
        },
        {
          type: 'bar', label: 'Egresos',
          data: serie.map(s => s.egresos),
          backgroundColor: 'rgba(231,76,60,.55)', borderRadius: 3, yAxisID: 'y',
        },
        {
          type: 'line', label: 'Saldo acum.',
          data: serie.map(s => s.saldo_acum),
          borderColor: '#4F8EF7', backgroundColor: 'rgba(79,142,247,.12)',
          fill: true, tension: 0.3, pointRadius: 3, pointBackgroundColor: '#4F8EF7',
          yAxisID: 'y',
        },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font:{size:10}, color:'#a3b1c6' } } },
      scales: {
        x: { ticks: { font:{size:9}, color:'#a3b1c6', maxRotation:45 }, grid:{display:false} },
        y: { ticks: { font:{size:9}, color:'#a3b1c6', callback: v => pesos(v,true) }, grid:{color:'rgba(163,177,198,.15)'} },
      }
    }
  });
}
