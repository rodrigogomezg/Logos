<script>
const API = window.CONFIG?.apiBase ?? '/Logos/api';
let tipoActual = 'ventas';

// Defaults: mes actual
const hoy = new Date();
const primerDia = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-01`;
const hoyStr    = hoy.toISOString().slice(0,10);
document.getElementById('tb-desde').value = primerDia;
document.getElementById('tb-hasta').value = hoyStr;

function setTipo(tipo, btn) {
  tipoActual = tipo;
  document.querySelectorAll('.tab-tipo').forEach(b => b.classList.toggle('activo', b === btn));
  document.getElementById('thead-ventas').style.display  = tipo === 'ventas'  ? '' : 'none';
  document.getElementById('thead-compras').style.display = tipo === 'compras' ? '' : 'none';
  cargar();
}

function pesos(n) {
  return '$ ' + Number(n).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function cargar() {
  const desde = document.getElementById('tb-desde').value;
  const hasta = document.getElementById('tb-hasta').value;
  if (!desde || !hasta) return;

  const data = await apiFetch(`${API}/iva/${tipoActual}?desde=${desde}&hasta=${hasta}`);
  const filas = data.filas || [];
  const tot   = data.totales || {};

  document.getElementById('count-lbl').textContent = `${filas.length} comprobante(s)`;
  document.getElementById('totales-bar').style.display = filas.length ? '' : 'none';

  // Mostrar/ocultar columnas de alícuotas según si hay datos
  const hay105  = filas.some(r => r.neto_105 > 0 || r.iva_105 > 0);
  const hayExen = filas.some(r => r.neto_exento > 0);
  const hayPerc = tipoActual === 'compras' && filas.some(r => r.percepcion_iibb > 0);

  ['wrap-105','wrap-iva105'].forEach(id => document.getElementById(id).style.display = hay105 ? '' : 'none');
  document.getElementById('wrap-exento').style.display = hayExen ? '' : 'none';
  document.getElementById('wrap-perc').style.display   = hayPerc ? '' : 'none';

  // Totales bar
  document.getElementById('tot-neto21').textContent = pesos(tot.neto_21 ?? 0);
  document.getElementById('tot-iva21').textContent  = pesos(tot.iva_21  ?? 0);
  document.getElementById('tot-neto105').textContent = pesos(tot.neto_105 ?? 0);
  document.getElementById('tot-iva105').textContent  = pesos(tot.iva_105  ?? 0);
  document.getElementById('tot-exento').textContent  = pesos(tot.neto_exento ?? 0);
  document.getElementById('tot-perc').textContent    = pesos(tot.percepcion_iibb ?? 0);
  document.getElementById('tot-total').textContent   = pesos(tot.total ?? 0);

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (!filas.length) {
    tbody.insertAdjacentHTML('beforeend', `<tr><td colspan="14" class="empty">Sin comprobantes para el período seleccionado.</td></tr>`);
    document.getElementById('tfoot').innerHTML = '';
    return;
  }

  if (tipoActual === 'ventas') {
    filas.forEach(r => {
      const nc = r.es_nc;
      tbody.insertAdjacentHTML('beforeend', `
        <tr class="${nc ? 'fila-nc' : ''}">
          <td>${r.fecha}</td>
          <td>${esc(r.tipo_comprobante)}${nc ? '<span class="badge-nc">NC</span>' : ''}</td>
          <td class="r">${r.punto_venta || '—'}</td>
          <td class="r">${esc(r.numero_afip) || '—'}</td>
          <td class="muted">${esc(r.cae || '—')}</td>
          <td>${esc(r.cliente_nombre || 'Consumidor Final')}</td>
          <td class="muted">${esc(r.cliente_cuit || '—')}</td>
          <td class="muted">${esc(r.cliente_condicion_iva || '—')}</td>
          <td class="r">${pesos(r.neto_21)}</td>
          <td class="r">${pesos(r.iva_21)}</td>
          <td class="r">${r.neto_105 > 0 ? pesos(r.neto_105) : '—'}</td>
          <td class="r">${r.iva_105  > 0 ? pesos(r.iva_105)  : '—'}</td>
          <td class="r">${r.neto_exento > 0 ? pesos(r.neto_exento) : '—'}</td>
          <td class="r"><strong>${pesos(r.total)}</strong></td>
        </tr>`);
    });
    document.getElementById('tfoot').innerHTML = `
      <tr class="tfoot-row">
        <td colspan="8">TOTALES</td>
        <td class="r">${pesos(tot.neto_21)}</td>
        <td class="r">${pesos(tot.iva_21)}</td>
        <td class="r">${pesos(tot.neto_105)}</td>
        <td class="r">${pesos(tot.iva_105)}</td>
        <td class="r">${pesos(tot.neto_exento)}</td>
        <td class="r">${pesos(tot.total)}</td>
      </tr>`;
  } else {
    filas.forEach(r => {
      tbody.insertAdjacentHTML('beforeend', `
        <tr>
          <td>${r.fecha}</td>
          <td>${esc(r.tipo_comprobante)}</td>
          <td class="muted">${esc(r.numero_comprobante || '—')}</td>
          <td>${esc(r.proveedor_nombre || '—')}</td>
          <td class="muted">${esc(r.proveedor_cuit || '—')}</td>
          <td class="r">${pesos(r.neto_21)}</td>
          <td class="r">${pesos(r.iva_21)}</td>
          <td class="r">${r.neto_105 > 0 ? pesos(r.neto_105) : '—'}</td>
          <td class="r">${r.iva_105  > 0 ? pesos(r.iva_105)  : '—'}</td>
          <td class="r">${r.neto_exento > 0 ? pesos(r.neto_exento) : '—'}</td>
          <td class="r">${pesos(r.iva_total)}</td>
          <td class="r">${r.percepcion_iibb > 0 ? pesos(r.percepcion_iibb) : '—'}</td>
          <td class="r"><strong>${pesos(r.total)}</strong></td>
        </tr>`);
    });
    document.getElementById('tfoot').innerHTML = `
      <tr class="tfoot-row">
        <td colspan="5">TOTALES</td>
        <td class="r">${pesos(tot.neto_21)}</td>
        <td class="r">${pesos(tot.iva_21)}</td>
        <td class="r">${pesos(tot.neto_105)}</td>
        <td class="r">${pesos(tot.iva_105)}</td>
        <td class="r">${pesos(tot.neto_exento)}</td>
        <td class="r">${pesos(tot.iva_total)}</td>
        <td class="r">${pesos(tot.percepcion_iibb)}</td>
        <td class="r">${pesos(tot.total)}</td>
      </tr>`;
  }
}

async function exportar() {
  const desde = document.getElementById('tb-desde').value;
  const hasta = document.getElementById('tb-hasta').value;
  if (!desde || !hasta) return;
  try {
    const r = await fetch(`${API}/iva/export?tipo=${tipoActual}&desde=${desde}&hasta=${hasta}`);
    if (!r.ok) { const e = await r.json().catch(() => ({})); toast_(e.error ?? 'Error al exportar', 'err'); return; }
    const blob = await r.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `libro_iva_${tipoActual}_${desde}_${hasta}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) { toast_('Error al exportar: ' + e.message, 'err'); }
}

cargar();
