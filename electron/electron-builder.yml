appId: com.drilogs.logos-pos
productName: Logos POS
copyright: Copyright © 2025 Drilogs
buildVersion: "1.0.11"

# Auto-update: electron-updater consulta latest.yml desde esta URL.
# El instalador .exe y latest.yml se suben a la misma ruta con npm run publish.
publish:
  provider: generic
  url: https://logos.drilogs.com.ar/
  channel: latest

directories:
  buildResources: build
  output: dist

# Electron app files (JS, renderer, services)
files:
  - "main.js"
  - "preload.js"
  - "build/icon.png"
  - "build/icon.ico"
  - "renderer/**"
  - "services/**"
  - "www/**"
  - "node_modules/**"
  - "!resources/**"
  - "!scripts/**"
  - "!dist/**"

# Extra non-JS resources bundled alongside the app in resources/
extraResources:
  # PHP + MariaDB portable binaries (downloaded via npm run setup-deps)
  - from: "resources/php"
    to: "php"
    filter: ["**/*"]
  - from: "resources/mariadb"
    to: "mariadb"
    filter: ["**/*"]
  # NSSM 2.24-101 x64 — Windows service manager (downloaded via npm run setup-deps)
  - from: "resources/nssm.exe"
    to: "nssm.exe"
  # Tailscale client binary (downloaded via npm run setup-deps when ready; inactive until remoteAccess.enabled=true)
  - from: "resources/tailscale"
    to: "tailscale"
    filter: ["**/*"]
  # Server setup/teardown scripts (tracked in git, executed by NSIS installer with admin rights)
  - from: "resources/setup-server.ps1"
    to: "setup-server.ps1"
  - from: "resources/teardown-server.ps1"
    to: "teardown-server.ps1"
  - from: "resources/wait-after-update.ps1"
    to: "wait-after-update.ps1"
  # PHP web root — the router + the Logos app source
  - from: "www"
    to: "www"
    filter: ["**/*"]
  # The actual PHP/HTML app files go into www/Logos/
  - from: ".."
    to: "www/Logos"
    filter:
      - "api/**"
      - "!api/config/db.local.php"
      - "pos/**"
      - "vendor/**"
      - "install/schema_limpio.sql"
      - "migrate/**"
      - "composer.json"
      - "logo*.png"
      - "!pos/.impeccable/**"
      - "!api/logs/**"

win:
  publisherName: "Drilogs"
  legalTrademarks: "Logos POS es un producto de Drilogs"
  # Sin certificado de firma de código todavía: sin esto, electron-updater
  # rechaza cualquier actualización descargada ("not signed by the application
  # owner") y nunca llega a instalarla, sin avisar nada visible al usuario.
  # TODO: sacar esto y firmar de verdad en cuanto haya certificado de Drilogs.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Logos POS"
  installerLanguages: ["es_ES"]
  language: 3082
  # Role selection dialog + NSSM service registration/teardown
  include: "build/installer.nsh"
