<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logos POS — Error</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px;
      user-select: none;
    }
    .icon { font-size: 40px; margin-bottom: 16px; }
    h2 { font-size: 17px; font-weight: 600; color: #f87171; margin-bottom: 10px; }
    .message {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 420px;
      background: #161b27;
      border: 1px solid #1e2330;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 12px;
    }
    .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
    button {
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: #4f8ef7; color: #fff; }
    .btn-primary:hover { background: #3d7de8; }
    .btn-secondary {
      background: transparent;
      color: #6b7280;
      border: 1.5px solid #1e2330;
    }
    .btn-secondary:hover { border-color: #374151; color: #9ca3af; }
    .btn-danger { background: transparent; color: #f87171; border: 1.5px solid #2d1515; }
    .btn-danger:hover { background: #1a0f0f; }
  </style>
</head>
<body>
  <div class="icon">⚠️</div>
  <h2 id="title">Error al iniciar</h2>
  <div class="message" id="message">Ocurrió un error inesperado.</div>

  <div class="actions" id="actions-server" style="display:none">
    <button class="btn-secondary" onclick="window.logos.resetConfig()">Reconfigurar</button>
  </div>

  <div class="actions" id="actions-client" style="display:none">
    <button class="btn-primary" onclick="window.logos.retryConnection()">Reintentar</button>
    <button class="btn-secondary" onclick="window.logos.reconfigureClient()">Cambiar servidor</button>
    <button class="btn-secondary" onclick="window.logos.resetConfig()">Volver al inicio</button>
  </div>

  <script>
    window.logos.onShowError(({ message, isServer }) => {
      document.getElementById('message').textContent = message;
      if (isServer) {
        document.getElementById('title').textContent = 'Error al iniciar el servidor';
        document.getElementById('actions-server').style.display = 'flex';
      } else {
        document.getElementById('title').textContent = 'Sin conexión al servidor';
        document.getElementById('actions-client').style.display = 'flex';
      }
    });
  </script>
</body>
</html>
