<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Logos POS — Actualizando</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: #fff; margin-bottom: 4px; }
    .logo span { color: #4f8ef7; }
    .tagline { font-size: 12px; color: #4b5563; margin-bottom: 32px; }

    .update-label {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 16px;
      text-align: center;
      min-height: 20px;
    }
    .update-label strong { color: #e8eaf0; }

    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #1e2330;
      border-top-color: #4f8ef7;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-track {
      width: 280px;
      height: 6px;
      background: #1e2330;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #4f8ef7;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .progress-pct {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .warning {
      font-size: 11px;
      color: #6b7280;
      text-align: center;
      max-width: 300px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="logo">Logos<span>POS</span></div>
  <div class="tagline">Sistema de Gestión</div>

  <div class="update-label" id="label">Verificando actualización…</div>

  <div class="spinner" id="spinner"></div>

  <div class="progress-track">
    <div class="progress-bar" id="bar"></div>
  </div>
  <div class="progress-pct" id="pct"></div>

  <div class="warning" id="warning"></div>

  <script>
    const label   = document.getElementById('label');
    const bar     = document.getElementById('bar');
    const pct     = document.getElementById('pct');
    const warning = document.getElementById('warning');

    window.logos.onUpdateStart((version) => {
      label.innerHTML = `Actualizando Logos POS a la versión <strong>v${version}</strong>`;
      warning.textContent = 'No cierres el programa — la actualización se instalará sola.';
    });

    window.logos.onUpdateProgress((percent) => {
      bar.style.width = percent + '%';
      pct.textContent = percent < 100 ? `Descargando… ${percent}%` : 'Descarga completa';
    });

    window.logos.onUpdateInstalling(() => {
      label.innerHTML = 'Instalando actualización…';
      bar.style.width = '100%';
      pct.textContent = '';
      document.getElementById('spinner').style.display = 'none';
      warning.textContent = 'La aplicación se reiniciará en unos segundos.';
    });
  </script>
</body>
</html>
