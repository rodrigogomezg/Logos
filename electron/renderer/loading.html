<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Logos POS — Iniciando</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: #fff; margin-bottom: 4px; }
    .logo span { color: #4f8ef7; }
    .tagline { font-size: 12px; color: #4b5563; margin-bottom: 40px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #1e2330;
      border-top-color: #4f8ef7;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #6b7280; min-height: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="logo">Logos<span>POS</span></div>
  <div class="tagline">Sistema de Gestión v1.0.1</div>
  <div class="spinner"></div>
  <div class="status" id="status">Iniciando…</div>

  <script>
    window.logos.onLoadingStatus(msg => {
      document.getElementById('status').textContent = msg;
    });
  </script>
</body>
</html>
